const App = () => {
  const ADMIN_PASSWORD_KEY = 'schedulerAdminPasswordHash';

  const getSafeStorage = () => {
    try {
      if (typeof window === 'undefined') return null;
      const s = window.localStorage;
      const k = '__scheduler_storage_probe__';
      s.setItem(k, '1');
      s.removeItem(k);
      return s;
    } catch (_) {
      return null;
    }
  };

  const safeStorageGet = (key) => {
    try {
      const s = getSafeStorage();
      return s ? s.getItem(key) : null;
    } catch (_) {
      return null;
    }
  };

	  const safeStorageSet = (key, value) => {
	    try {
	      const s = getSafeStorage();
	      if (!s) return false;
	      s.setItem(key, value);
	      return true;
	    } catch (_) {
	      return false;
	    }
	  };

	  const encodeSharePayload = (payload) => {
	    const json = JSON.stringify(payload);
	    const bytes = new TextEncoder().encode(json);
	    let binary = '';
	    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
	    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
	  };

	  const decodeSharePayload = (encoded) => {
	    try {
	      if (!encoded) return null;
	      const normalized = encoded.replace(/-/g, '+').replace(/_/g, '/');
	      const padded = normalized.padEnd(normalized.length + ((4 - normalized.length % 4) % 4), '=');
	      const binary = atob(padded);
	      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
	      return JSON.parse(new TextDecoder().decode(bytes));
	    } catch (error) {
	      console.error('工讀生連結資料解析失敗', error);
	      return null;
	    }
	  };

	  const getAssistantSharePayloadFromUrl = () => {
	    try {
	      const params = new URLSearchParams(window.location.search);
	      if (params.get('assistantCard') !== '1') return null;
	      const hashParams = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
	      return decodeSharePayload(hashParams.get('data'));
	    } catch (error) {
	      console.error('讀取工讀生連結失敗', error);
	      return null;
	    }
	  };

  const hashAdminPassword = (value) => {
    const input = `4p-scheduler-admin::${value}`;
    let h1 = 0xdeadbeef;
    let h2 = 0x41c6ce57;
    for (let i = 0; i < input.length; i++) {
      const ch = input.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return `${(h2 >>> 0).toString(16).padStart(8, '0')}${(h1 >>> 0).toString(16).padStart(8, '0')}`;
  };

	  const ensureScheduleShape = (rawSchedule) => {
	    if (!rawSchedule || typeof rawSchedule !== 'object') {
	      return { combined: [], grouped: [] };
	    }
	    return {
	      combined: Array.isArray(rawSchedule.combined) ? rawSchedule.combined : [],
	      grouped: Array.isArray(rawSchedule.grouped) ? rawSchedule.grouped : [],
	      strategyId: rawSchedule.strategyId || '',
	      strategyName: rawSchedule.strategyName || ''
	    };
	  };

		  };

  const handleAdminSubmit = (e) => {
    e.preventDefault();
    const password = adminPasswordInput.trim();
    if (password.length < 6) {
      setAdminError('管理密碼至少需要 6 個字元。');
      return;
    }

    const nextHash = hashAdminPassword(password);
    if (!adminPasswordHash) {
      setAdminPasswordHash(nextHash);
      safeStorageSet(ADMIN_PASSWORD_KEY, nextHash);
      setIsAdminMode(true);
      setShowAdminModal(false);
      setAdminPasswordInput('');
      setAdminError('');
      return;
    }

    if (nextHash !== adminPasswordHash) {
      setAdminError('管理密碼不正確。');
      return;
    }

    setIsAdminMode(true);
    setShowAdminModal(false);
    setAdminPasswordInput('');
    setAdminError('');

    const nextId = registrationSlots.reduce((m, s) => Math.max(m, s.id), 0) + 1;
    let nextStart = '17:00';
    let nextEnd = '17:30';
    if (last) {
      const lastStart = parseTime(last.start);
      const lastEnd = parseTime(last.end);
      const len = Math.max(10, lastEnd - lastStart);
      const newStart = Math.min(23 * 60 + 30, lastEnd + 30);
      const newEnd = Math.min(23 * 60 + 59, newStart + len);
      nextStart = formatTime(newStart);
      nextEnd = formatTime(newEnd);
    }
    setRegistrationSlots([...registrationSlots, { id: nextId, start: nextStart, end: nextEnd, name: `時段 ${registrationSlots.length + 1}` }]);

      setRawData("准考證號,姓名,縣市\n" + generateMockData());

  // 當資料有變動時，自動存入 LocalStorage (防呆機制)
  useEffect(() => {

  useEffect(() => {

    safeStorageSet('departmentProfilesData', JSON.stringify(departmentProfiles));
  }, [departmentProfiles, isInitialized]);

  const normalizeCityName = (name) => name.replace(/臺/g, '台');

  const handleFileUpload = (e, targetMode) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      if (window.XLSX) {
        try {
          const wb = window.XLSX.read(data, { type: 'array' });
          const wsname = wb.SheetNames[0];
          const csvStr = window.XLSX.utils.sheet_to_csv(wb.Sheets[wsname]);
          if (targetMode === 'students') {
             setRawData(csvStr);
             alert(`已成功讀取「${file.name}」！請點擊下方「解析名單」。`);
          } else {
             setSlotRawData(csvStr);
             alert(`已成功讀取「${file.name}」！請點擊下方「比對並更新」。`);
          }
        } catch (err) {
          alert('檔案解析失敗，請確認檔案格式。');
        }
      } else { alert('Excel 引擎正在載入，請稍後再試。'); }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = null; 
  };

  const handleParseData = () => {
    const lines = rawData.trim().split('\n');
    if (lines.length < 2) return;

    const headers = lines[0].split(',').map(h => h.trim());
    let idIdx = headers.indexOf('報名序號');
    let nameIdx = headers.indexOf('姓名');
    let addrIdx = headers.indexOf('地址');
    let cityIdx = headers.indexOf('縣市');

    if (idIdx === -1) idIdx = 0;
    if (nameIdx === -1) nameIdx = 1;
    if (cityIdx !== -1) addrIdx = cityIdx;
    else if (addrIdx === -1) addrIdx = 2;

    const parsedStudents = [];
    let startIndex = isNaN(parseInt(lines[0].split(',')[0])) ? 1 : 0;

    for (let i = startIndex; i < lines.length; i++) {
      const parts = lines[i].split(','); 
      if (parts.length < 3) continue;
      const id = parts[idIdx]?.trim();
      const name = parts[nameIdx]?.trim();
      const address = parts[addrIdx]?.trim() || '';

      let rawCity = '未知';
      const cityMatch = address.match(/^(.{2,3}[縣市])/);
      if (cityMatch) rawCity = cityMatch[1];
      else rawCity = address.substring(0, 3);
      
      const city = normalizeCityName(rawCity);
      let regionAssigned = '未分配 (其他)';
      let regionOrder = 999;
      
      for (let rIdx = 0; rIdx < regions.length; rIdx++) {
        if (regions[rIdx].counties.includes(city)) {
          regionAssigned = regions[rIdx].name;
          regionOrder = rIdx; break;
        }
      }
      if (id && name) {
	        parsedStudents.push({ 
		          id, name, city, region: regionAssigned, regionOrder,
		          isCrossDept: false, blockedStart: '10:00', blockedEnd: '12:00',
		          preferredSlot: null, assignedSlot: null, checkinStatus: '未報到', note: '', subsidyReceived: false
		        });
      }
    }
    
    parsedStudents.sort((a, b) => {
      if (a.regionOrder !== b.regionOrder) return a.regionOrder - b.regionOrder;
      return a.id.localeCompare(b.id);
    });

    setStudents(ensureStudentCheckinNos(parsedStudents));
    alert(`成功解析 ${parsedStudents.length} 筆學生資料！`);
  };

  const handleParseSlots = () => {
    if (students.length === 0) {
      alert("請先匯入「學生名單」後，再匯入意願調查結果！"); return;
    }
    const lines = slotRawData.trim().split('\n');
    let startIndex = isNaN(parseInt(lines[0].split(',')[0])) ? 1 : 0;
    let matchCount = 0;
    const updatedStudents = [...students];
    const validSlotIds = new Set(registrationSlots.map(s => Number(s.id)));

    for (let i = startIndex; i < lines.length; i++) {
      const parts = lines[i].split(','); 
      if (parts.length < 2) continue;
      const id = parts[0]?.trim();
      const slotNum = parseInt(parts[1]?.trim());

      if (id && !isNaN(slotNum) && validSlotIds.has(slotNum)) {
        const studentIndex = updatedStudents.findIndex(s => s.id === id);
        if (studentIndex !== -1) {
          updatedStudents[studentIndex].preferredSlot = slotNum;
          matchCount++;
        }
      }
    }
    setStudents(ensureStudentCheckinNos(updatedStudents));
    alert(`成功比對並更新 ${matchCount} 筆報到意願！`);
    setActiveTab('students');
  };

  const handleUpdateStudentByIndex = (index, field, value) => {
    setStudents(prev => prev.map((s, idx) => {
      if (idx !== index) return s;
      const updated = { ...s, [field]: value };
      if (field === 'checkinNo') {
        updated.checkinNo = String(value || '').replace(/[^\dA-Za-z-]/g, '').trim();
      }
      if (field === 'id') {
        updated.id = String(value || '').trim();
      }
      if (field === 'region') {
        const regionIdx = regions.findIndex(r => r.name === value);
        updated.regionOrder = regionIdx === -1 ? 999 : regionIdx;
      }
      return updated;
    }));
  };

  const updateAssistantCount = (value) => {
    const nextCount = Math.max(1, Number(value) || 1);
    setSettings(prev => ({
      ...prev,
      assistantsCount: nextCount,
      assistantNames: normalizeAssistantNames(prev.assistantNames, nextCount)
    }));
  };

  const updateAssistantName = (index, value) => {
    setSettings(prev => {
      const names = normalizeAssistantNames(prev.assistantNames, prev.assistantsCount);
      names[index] = value;
      return { ...prev, assistantNames: names };
    });
  };

  const updatePracticeRoomCount = (value) => {
    const nextCount = Math.max(1, Number(value) || 1);
    setSettings(prev => ({
      ...prev,
      practiceRooms: nextCount,
      practiceRoomNames: normalizeRoomNames(prev.practiceRoomNames, nextCount, '實作教室')
    }));
  };

  const updateInterviewRoomCount = (value) => {
    const nextCount = Math.max(1, Number(value) || 1);
    setSettings(prev => ({

      interviewRooms: nextCount,
      interviewRoomNames: normalizeRoomNames(prev.interviewRoomNames, nextCount, '面試考場')
    }));
  };

  const updatePracticeRoomName = (index, value) => {
    setSettings(prev => {
      const names = normalizeRoomNames(prev.practiceRoomNames, prev.practiceRooms, '實作教室');
      names[index] = value;
      return { ...prev, practiceRoomNames: names };
    });
  };

  const updateInterviewRoomName = (index, value) => {
    setSettings(prev => {
      const names = normalizeRoomNames(prev.interviewRoomNames, prev.interviewRooms, '面試考場');
      names[index] = value;
      return { ...prev, interviewRoomNames: names };
    });
  };

	  const isLeadAssistantName = (name) => (
	    normalizeAssistantNames(settings.assistantNames, settings.assistantsCount).includes(String(name || '').trim())
	  );

	  const getLeadAssistant = (info) => (
	    info.events.find(e => !e.isRegistration && isLeadAssistantName(e.assistant))?.assistant ||
	    info.events.find(e => isLeadAssistantName(e.assistant))?.assistant ||
	    (isLeadAssistantName(info.assistant) ? info.assistant : '') ||
	    ''
	  );

	  const getNextMobileEvent = (info) => (
	    info.events.find(e => !e.isRegistration && !e.isTransit) ||
	    info.events.find(e => !e.isRegistration) ||
	    info.events[0]
	  );

	  const getCurrentStudent = (student) => {
	    const match = students.find(s => s.id === student?.id || (s.checkinNo && s.checkinNo === student?.checkinNo));
	    return match ? { ...student, ...match } : student;
	  };

	  const getCheckinStatus = (student) => {
	    const current = getCurrentStudent(student);
	    return CHECKIN_STATUS_OPTIONS.includes(current?.checkinStatus) ? current.checkinStatus : '未報到';
	  };

	  const renderCheckinStatusBadge = (status) => (
	    <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold border ${CHECKIN_STATUS_STYLE[status] || CHECKIN_STATUS_STYLE['未報到']}`}>
	      {status || '未報到'}
	    </span>
	  );

	  const getTaskKey = (assistantName, groupId, eventIndex) => `${assistantName || '未指派'}__${groupId || '未分組'}__${eventIndex}`;
	  const getTaskStatus = (assistantName, groupId, eventIndex) => taskConfirmations[getTaskKey(assistantName, groupId, eventIndex)] || '';
	  const getTaskStatusMeta = (status) => ({
	    label: TASK_STATUS_LABEL[status] || TASK_STATUS_LABEL[''],
	    className: TASK_STATUS_STYLE[status] || TASK_STATUS_STYLE['']
	  });
	  const cycleTaskConfirmation = (assistantName, groupId, eventIndex) => {
	    const key = getTaskKey(assistantName, groupId, eventIndex);
	    setTaskConfirmations(prev => {
	      const currentIdx = TASK_STATUS_STEPS.indexOf(prev[key] || '');
	      const next = TASK_STATUS_STEPS[(currentIdx + 1) % TASK_STATUS_STEPS.length];
	      const updated = { ...prev };
	      if (next) updated[key] = next;
	      else delete updated[key];
	      return updated;
	    });
	  };

	  const handleTaskConfirmationClick = (assistantName, groupId, eventIndex) => {
	    const currentStatus = getTaskStatus(assistantName, groupId, eventIndex);
	    const nextStatus = getNextTaskStatus(currentStatus);
	    setTaskConfirmationStatus(assistantName, groupId, eventIndex, nextStatus);
	    submitTaskConfirmationToCloud({

	      departmentId: selectedDepartmentId,
	      assistantName,
	      groupId,
	      eventIndex,
	      status: nextStatus
	    });
	  };

	  const setTaskConfirmationStatus = (assistantName, groupId, eventIndex, status) => {
	    const key = getTaskKey(assistantName, groupId, eventIndex);
	    setTaskConfirmations(prev => {
	      const updated = { ...prev };
	      if (status) updated[key] = status;
	      else delete updated[key];
	      return updated;
	    });
	  };

	  const getNextTaskStatus = (currentStatus) => {
	    const currentIdx = TASK_STATUS_STEPS.indexOf(currentStatus || '');
	    return TASK_STATUS_STEPS[(currentIdx + 1) % TASK_STATUS_STEPS.length];
	  };

	  const getStudentScheduleInfo = (student) => {
	    const group = schedule.grouped.find(info => (info.allStudents || []).some(s => s.id === student.id || s.checkinNo === student.checkinNo));
	    if (!group) return null;
	    const leadAssistant = getLeadAssistant(group);
	    const nextEvent = getNextMobileEvent(group);
	    return { group, leadAssistant, nextEvent };
	  };

	  const getStudentLookupKey = (student) => `${student?.checkinNo || ''}__${student?.id || ''}__${student?.name || ''}`;

	  const getRoundCapacity = () => {
	    const ROUND_COUNT = 4;
	    const TIERS_PER_ROUND = 2;
	    const BASE_TEAMS_PER_TIER = 2;
	    const GROUPS_PER_TEAM = 2;
	    const STUDENTS_PER_GROUP = 5;
	    const assistantsCount = Math.max(1, Number(settings.assistantsCount || 1));
	    if (registrationSlots.length !== ROUND_COUNT || assistantsCount < TIERS_PER_ROUND * BASE_TEAMS_PER_TIER) return null;
	    const teamsPerTier = BASE_TEAMS_PER_TIER + Math.floor(Math.max(0, assistantsCount - (TIERS_PER_ROUND * BASE_TEAMS_PER_TIER)) / TIERS_PER_ROUND);
	    return TIERS_PER_ROUND * teamsPerTier * GROUPS_PER_TEAM * STUDENTS_PER_GROUP;
	  };

	  const getFastestInsertSlotRecommendation = (targetStudent = null) => {
	    const capacityPerRound = getRoundCapacity();
	    if (!capacityPerRound || registrationSlots.length === 0) {
	      return {
	        capacityPerRound: 0,
	        recommendedSlot: null,
	        preferredSlot: null,
	        preferredSlotAvailable: false,
	        summary: [],
	        constraintText: '請先完成四個報到時段設定並確保工讀生人數足夠。'
	      };
	    }

	    const sortedSlots = [...registrationSlots].sort((a, b) => parseTime(a.start) - parseTime(b.start));
	    const counts = Object.fromEntries(sortedSlots.map(slot => [Number(slot.id), 0]));
	    const targetKey = targetStudent ? getStudentLookupKey(targetStudent) : '';

	    students.forEach(student => {
	      if (targetKey && getStudentLookupKey(student) === targetKey) return;
	      const slotId = Number(student.assignedSlot);
	      if (counts[slotId] != null) counts[slotId] += 1;
	    });

	    const afternoonStartTime = Math.max(parseTime(settings.lunchEnd), 12 * 60);
	    let eligibleSlots = sortedSlots.filter(slot => counts[Number(slot.id)] < capacityPerRound);
	    let constraintText = '依目前名額，顯示最早可補位的報到時段。';

	    if (targetStudent?.isCrossDept) {
	      const blockedEndTime = parseTime(targetStudent.blockedEnd || '');

	      const slotId = Number(slot.id);
	      const count = counts[slotId] || 0;
	      const remaining = Math.max(0, capacityPerRound - count);
	      const isEligible = eligibleSlots.some(item => Number(item.id) === slotId);
	      return {
	        slot,
	        count,
	        remaining,
	        isEligible,
	        isRecommended: recommendedSlot ? Number(recommendedSlot.id) === slotId : false
	      };

	                      <div className="text-xs font-bold opacity-80">帶隊</div>
	                      <div className="font-bold mt-1">{leadAssistant || '未指派'}</div>
	                    </div>
	                  </div>
	                </div>
	                <div className="p-4 space-y-3">
	                  <div className="grid grid-cols-2 gap-2">
	                    <div className="bg-slate-50 border border-slate-100 rounded-xl p-3">
	                      <div className="text-xs font-bold text-slate-500">集合時間</div>
	                      <div className="text-lg font-extrabold text-slate-800 mt-1">{registrationEvent ? `${registrationEvent.startTime} - ${registrationEvent.endTime}` : `${nextEvent?.startTime || ''} - ${nextEvent?.endTime || ''}`}</div>
	                    </div>
	                    <div className="bg-slate-50 border border-slate-100 rounded-xl p-3">
	                      <div className="text-xs font-bold text-slate-500">人數</div>
	                      <div className="text-lg font-extrabold text-slate-800 mt-1">{info.allStudents.length} 人</div>
	                    </div>
	                  </div>
		                  <div className={`${assistantColor.accentSoftBg} border ${assistantColor.accentBorder} rounded-xl p-3`}>
	                    <div className={`text-xs font-bold ${assistantColor.accentText}`}>下一站</div>
	                    <div className="text-xl font-extrabold text-slate-900 mt-1">{nextEvent?.type || '尚未排定'} {nextEvent?.batchInfo || ''}</div>
	                    <div className="mt-2 flex items-start text-sm font-bold text-slate-600">
	                      <Clock size={16} className="mr-1.5 mt-0.5 shrink-0" /> {nextEvent ? `${nextEvent.startTime} - ${nextEvent.endTime}` : '尚未排定'}
	                    </div>
	                    <div className="mt-1 flex items-start text-sm font-bold text-slate-600">
	                      <MapIcon size={16} className="mr-1.5 mt-0.5 shrink-0" /> {nextEvent?.room || '尚未排定'}
		                    </div>
		                  </div>
		                  <div>
		                    <div className="flex items-center justify-between mb-2">
		                      <h4 className="text-sm font-bold text-slate-700">任務確認</h4>
		                      <span className="text-xs font-bold text-slate-400">點一下切換狀態</span>
		                    </div>
		                    <div className="space-y-1.5">
		                      {(info.events || []).map((ev, evIdx) => {
		                        const taskStatus = getTaskStatus(leadAssistant, info.id, evIdx);
		                        const taskMeta = getTaskStatusMeta(taskStatus);
		                        return (
		                          <button
		                            key={`${info.id}-task-${evIdx}`}
		                            type="button"
		                            onClick={() => handleTaskConfirmationClick(leadAssistant, info.id, evIdx)}
		                            className={`w-full flex items-center justify-between gap-2 rounded-lg border px-3 py-2 text-left transition-colors ${taskMeta.className}`}
		                          >
		                            <span className="min-w-0">
		                              <span className="block text-xs font-extrabold">{ev.startTime} - {ev.endTime}</span>
		                              <span className="block text-sm font-bold truncate">{ev.type} {ev.batchInfo || ''}</span>
		                            </span>
		                            <span className="shrink-0 text-xs font-extrabold">{taskMeta.label}</span>
		                          </button>
		                        );
		                      })}
		                    </div>
		                  </div>
		                  <div>
	                    <div className="flex items-center justify-between mb-2">
	                      <h4 className="text-sm font-bold text-slate-700">學生名單</h4>
	                      <span className={`text-xs font-bold ${assistantColor.accentText} ${assistantColor.accentSoftBg} border ${assistantColor.accentBorder} px-2 py-1 rounded-md`}>{info.allStudents.length} 人</span>
	                    </div>
		                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-1.5">
	                      {info.allStudents.map(s => (
		                        <span key={`${info.id}-${s.id}`} className={`text-sm border px-3 py-2 rounded-lg flex items-center justify-between gap-2 font-bold ${s.isCrossDept ? 'bg-orange-50 border-orange-200 text-orange-700' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
		                          <span className="min-w-0 truncate flex items-center">
		                            {s.isCrossDept && <AlertTriangle size={12} className="mr-1.5 shrink-0" />}
		                            {formatStudentLabel(getCurrentStudent(s))}
		                          </span>
		                          {renderCheckinStatusBadge(getCheckinStatus(s))}
		                        </span>
	                      ))}
	                    </div>
	                  </div>
	                </div>
	              </div>
	            );
	          })}
	      </div>
	    </div>
	    );
	  };

	  function parseTime(timeStr) {
	    const [h, m] = String(timeStr || '').split(':').map(Number);
	    return h * 60 + m;
	  }

  function formatTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
  }

  const isNoSnapshotError = (error) => String(error?.message || error || '').includes('no_snapshot');

  const openScheduleStrategyModal = () => {
    if (students.length === 0) { alert("請先匯入並解析學生資料！"); return; }
    if (registrationSlots.length === 0) { alert("請至少設定一個報到時段。"); return; }
    setShowStrategyModal(true);
  };

  const getStrategyPattern = (strategyId, roundNo, tierNo) => {
    if (strategyId === 'practice-first') return 'P-I';
    if (strategyId === 'interview-first') return 'I-P';
    if (strategyId === 'round-rotate') return roundNo % 2 === 1 ? 'I-P' : 'P-I';
    return tierNo === 1 ? 'I-P' : 'P-I';
  };

  const buildDepartmentRuleConfig = (strategyId = selectedScheduleStrategy) => {
    const sortedSlots = [...registrationSlots].sort((a, b) => parseTime(a.start) - parseTime(b.start));
    const assistantsCount = Math.max(1, Number(settings.assistantsCount || 1));
    const selectedStrategy = SCHEDULE_STRATEGIES.find(strategy => strategy.id === strategyId) || SCHEDULE_STRATEGIES[0];
    const ruleMode = strategyId === 'buffer-pool'
      ? 'buffer_pool'
      : (settings.ruleMode === 'buffer_pool' ? 'buffer_pool' : 'pipeline');
    return {
      version: '1.0.0',
      mode: ruleMode,
      strategyId: selectedStrategy.id,
      strategyName: selectedStrategy.name,
      resources: {
        assistants: {
          count: assistantsCount,
          names: normalizeAssistantNames(settings.assistantNames, assistantsCount)
        },
        practiceRooms: {
          count: Math.max(1, Number(settings.practiceRooms || 1)),
          names: normalizeRoomNames(settings.practiceRoomNames, settings.practiceRooms, '實作教室'),
          capacityPerRoom: Math.max(1, Number(settings.groupSize || 1))
        },
        interviewRooms: {
          count: Math.max(1, Number(settings.interviewRooms || 1)),
          names: normalizeRoomNames(settings.interviewRoomNames, settings.interviewRooms, '面試考場')
        }
      },
      time: {
        dayStart: settings.startTime,
        dayEnd: settings.endTime,
        lunchStart: settings.lunchStart,
        lunchEnd: settings.lunchEnd,
        practiceMinutes: Math.max(1, Number(settings.practiceMinutes || 1)),
        interviewMinutes: Math.max(1, Number(settings.interviewMinutes || 1)),
        transitMinutes: Math.max(0, Number(settings.transitMinutes || 0)),
        interviewBreakRule: {
          workBlockMinutes: 40,
          breakMinutes: 10
        }
      },
      registrationSlots: sortedSlots,
      pipeline: {
        rounds: sortedSlots.length,
        tiersPerRound: 2,
        baseTeamsPerTier: 2,
        groupsPerTeam: 2,
        studentsPerGroup: 5,
        allowPatternSwap: true
      },
      bufferPool: {
        bucketLabels: sortedSlots.map(slot => slot.name),
        launchSize: Math.max(1, Number(settings.interviewBatchSize || 5)),
        groupsPerTeam: 2,
        studentsPerGroup: 5,
        flowPattern: selectedStrategy.id === 'interview-first' ? 'I-P' : 'P-I'
      },
      constraints: {
        optimizeForEarlyFinish: true,
        assistantNoOverlap: true,
        preferRequestedSlot: true,
        crossDeptPreferNearestAfternoon: true
      }
    };
  };

  const buildGroupedFlow = (events, assistantNames) => {
    const groupsMap = {};
    events.forEach(item => {
      if (!groupsMap[item.groupId]) groupsMap[item.groupId] = { id: item.groupId, region: item.region, assistant: '', allStudents: [], events: [] };
      groupsMap[item.groupId].events.push(item);
      if (item.students && !item.isTransit && !item.isRegistration) {
        item.students.forEach(s => {
          if (!groupsMap[item.groupId].allStudents.find(ex => ex.id === s.id)) groupsMap[item.groupId].allStudents.push(s);
        });
      }
    });
    const assistantNameSet = new Set(assistantNames.map(name => String(name || '').trim()));
    return Object.values(groupsMap).map(group => {
      group.events.sort((a, b) => a.startTimeMins - b.startTimeMins);
      if (group.allStudents.length === 0) {
        const regEvent = group.events.find(e => e.isRegistration);
        if (regEvent?.students) group.allStudents = regEvent.students;
      }
      const leadEvent =
        group.events.find(e => !e.isRegistration && assistantNameSet.has(String(e.assistant || '').trim())) ||
        group.events.find(e => assistantNameSet.has(String(e.assistant || '').trim()));
      group.assistant = leadEvent ? leadEvent.assistant : '';
      return group;
    });
  };

  const findAssistantConflicts = (events, assistantNames) => {
    const assistantNameSet = new Set(assistantNames.map(name => String(name || '').trim()));
    const assistantEvents = events
      .filter(item => assistantNameSet.has(String(item.assistant || '').trim()))
      .map(item => ({
        assistant: item.assistant,
        groupId: item.groupId,
        start: item.startTimeMins,
        end: parseTime(item.endTime)
      }))
      .filter(item => Number.isFinite(item.start) && Number.isFinite(item.end) && item.end > item.start)
      .sort((a, b) => a.assistant.localeCompare(b.assistant, 'zh-Hant') || a.start - b.start);
    const conflicts = [];
    for (let i = 1; i < assistantEvents.length; i++) {
      const prev = assistantEvents[i - 1];
      const curr = assistantEvents[i];
      if (prev.assistant === curr.assistant && curr.start < prev.end) {
        conflicts.push(`${curr.assistant}：${formatTime(curr.start)}-${formatTime(Math.min(prev.end, curr.end))}（${prev.groupId} / ${curr.groupId}）`);
      }
    }
    return conflicts;
  };

  const generatePipelineSchedule = (inputStudents, deptConfig) => {
    const slots = [...(deptConfig.registrationSlots || [])].sort((a, b) => parseTime(a.start) - parseTime(b.start));
    if (slots.length === 0) return { ok: false, error: '請至少設定一個報到時段。' };

    const assistantsCount = Math.max(1, Number(deptConfig.resources?.assistants?.count || 1));
    const tiersPerRound = Math.max(1, Number(deptConfig.pipeline?.tiersPerRound || 2));
    const baseTeamsPerTier = Math.max(1, Number(deptConfig.pipeline?.baseTeamsPerTier || 2));
    const groupsPerTeam = Math.max(1, Number(deptConfig.pipeline?.groupsPerTeam || 2));
    const studentsPerGroup = Math.max(1, Number(deptConfig.pipeline?.studentsPerGroup || 5));
    const minAssistantsNeeded = tiersPerRound * baseTeamsPerTier;
    if (assistantsCount < minAssistantsNeeded) {
      return { ok: false, error: `此分法至少需要 ${minAssistantsNeeded} 位工讀生。` };
    }
    const teamsPerTier = baseTeamsPerTier + Math.floor(Math.max(0, assistantsCount - minAssistantsNeeded) / tiersPerRound);
    const studentsPerTier = teamsPerTier * groupsPerTeam * studentsPerGroup;
    const studentsPerRound = tiersPerRound * studentsPerTier;

    const slotIds = slots.map(slot => Number(slot.id));
    const slotCounts = Object.fromEntries(slotIds.map(id => [id, 0]));
    const assignedSlotsByIndex = new Map();
    const lunchEnd = parseTime(deptConfig.time?.lunchEnd || '13:00');
    const afternoonStartTime = Math.max(lunchEnd, 12 * 60);

    const findLeastFilledSlot = (possibleSlots = slotIds) => {
      if (!possibleSlots.length) return null;
      return possibleSlots.reduce((minSlot, slotId) => (slotCounts[slotId] < slotCounts[minSlot] ? slotId : minSlot), possibleSlots[0]);
    };

    const findCrossDeptPreferredSlot = (student) => {
      if (!student.isCrossDept) return null;
      const blockedEnd = parseTime(student.blockedEnd || '');
      const readyTime = Number.isFinite(blockedEnd) ? Math.max(blockedEnd, afternoonStartTime) : afternoonStartTime;
      const possible = slots.filter(slot => parseTime(slot.start) >= readyTime).map(slot => Number(slot.id));
      if (!possible.length) return null;
      const available = possible.find(slotId => slotCounts[slotId] < studentsPerRound);
      return available || possible[0];
    };

    let currentStudents = [...inputStudents];
    currentStudents.forEach((student, idx) => {
      if (student.preferredSlot && slotCounts[student.preferredSlot] != null) {
        assignedSlotsByIndex.set(idx, student.preferredSlot);
        slotCounts[student.preferredSlot]++;
      }
    });
    currentStudents.forEach((student, idx) => {
      if (assignedSlotsByIndex.has(idx)) return;
      const crossDeptSlot = findCrossDeptPreferredSlot(student);
      if (crossDeptSlot) {
        assignedSlotsByIndex.set(idx, crossDeptSlot);
        slotCounts[crossDeptSlot]++;
      }
    });
    currentStudents = currentStudents.map((student, idx) => {
      if (assignedSlotsByIndex.has(idx)) return { ...student, assignedSlot: assignedSlotsByIndex.get(idx) };
      const minSlot = findLeastFilledSlot();
      if (!minSlot) return { ...student, assignedSlot: null };
      slotCounts[minSlot]++;
      return { ...student, assignedSlot: minSlot };
    });

    const overloadedSlots = slots
      .map(slot => ({ slot, count: currentStudents.filter(student => student.assignedSlot === Number(slot.id)).length }))
      .filter(item => item.count > studentsPerRound);
    if (overloadedSlots.length > 0) {
      const details = overloadedSlots.map(item => `${item.slot.name}：${item.count} 人（上限 ${studentsPerRound}）`).join('\n');
      return { ok: false, error: `以下時段超過容量：\n${details}\n\n請調整報到時段後再重排。` };
    }

    const getMainRegion = (groupStudents) => {
      if (!groupStudents.length) return '未分配 (其他)';
      const counter = {};
      groupStudents.forEach(student => {
        const key = student.region || '其他';
        counter[key] = (counter[key] || 0) + 1;
      });
      return Object.entries(counter).sort((a, b) => b[1] - a[1])[0][0];
    };

    const buildTierSubGroups = (tierStudents, teamsCount) => {
      const subGroups = [];
      for (let teamIdx = 0; teamIdx < teamsCount; teamIdx++) {
        for (let groupIdx = 0; groupIdx < groupsPerTeam; groupIdx++) {
          const startIndex = ((teamIdx * groupsPerTeam) + groupIdx) * studentsPerGroup;
          const members = tierStudents.slice(startIndex, startIndex + studentsPerGroup);
          if (!members.length) continue;
          subGroups.push({
            label: `第 ${teamIdx + 1} 隊・第 ${groupIdx + 1} 組`,
            team: teamIdx + 1,
            group: groupIdx + 1,
            students: members
          });
        }
      }
      return subGroups;
    };

    const allGroups = [];
    slots.forEach((slot, roundIdx) => {
      const roundNo = roundIdx + 1;
      const slotId = Number(slot.id);
      const roundStudents = currentStudents.filter(student => student.assignedSlot === slotId);
      const tierAStudents = roundStudents.slice(0, studentsPerTier);
      const tierBStudents = roundStudents.slice(studentsPerTier, studentsPerTier * 2);
      const tiers = [
        { students: tierAStudents, tierNo: 1, pattern: getStrategyPattern(deptConfig.strategyId, roundNo, 1) },
        { students: tierBStudents, tierNo: 2, pattern: getStrategyPattern(deptConfig.strategyId, roundNo, 2) }
      ];
      tiers.forEach(tier => {
        if (!tier.students.length) return;
        const subGroups = buildTierSubGroups(tier.students, teamsPerTier);
        for (let teamNo = 1; teamNo <= teamsPerTier; teamNo++) {
          const teamSubGroups = subGroups.filter(subGroup => subGroup.team === teamNo);
          if (!teamSubGroups.length) continue;
          const teamStudents = teamSubGroups.flatMap(subGroup => subGroup.students);
          allGroups.push({
            id: `R${roundNo}-梯${tier.tierNo}-隊${teamNo}`,
            slotId,
            roundNo,
            tierNo: tier.tierNo,
            teamNo,
            preferredPattern: tier.pattern,
            students: teamStudents,
            subGroups: teamSubGroups,
            region: getMainRegion(teamStudents)
          });
        }
      });
    });

    allGroups.sort((a, b) => (
      a.roundNo - b.roundNo ||
      a.tierNo - b.tierNo ||
      a.teamNo - b.teamNo
    ));

    const dayStart = parseTime(deptConfig.time?.dayStart || '08:00');
    const dayEnd = parseTime(deptConfig.time?.dayEnd || '18:00');
    const lunchStart = parseTime(deptConfig.time?.lunchStart || '12:00');
    const lunchEndMins = parseTime(deptConfig.time?.lunchEnd || '13:00');
    const practiceMinutes = Number(deptConfig.time?.practiceMinutes || 40);
    const interviewMinutes = Number(deptConfig.time?.interviewMinutes || 10);
    const transitMinutes = Number(deptConfig.time?.transitMinutes || 10);
    const interviewWorkBlock = Number(deptConfig.time?.interviewBreakRule?.workBlockMinutes || 40);
    const interviewBreakMinutes = Number(deptConfig.time?.interviewBreakRule?.breakMinutes || 10);
    const practiceRoomCount = Math.max(1, Number(deptConfig.resources?.practiceRooms?.count || 1));
    const practiceRoomNames = normalizeRoomNames(deptConfig.resources?.practiceRooms?.names, practiceRoomCount, '實作教室');
    const interviewRoomCount = Math.max(1, Number(deptConfig.resources?.interviewRooms?.count || 1));
    const interviewRoomNames = normalizeRoomNames(deptConfig.resources?.interviewRooms?.names, interviewRoomCount, '面試考場');
    const assistantNames = normalizeAssistantNames(deptConfig.resources?.assistants?.names, assistantsCount);
    const practiceCapacityPerRoom = Math.max(1, Number(deptConfig.resources?.practiceRooms?.capacityPerRoom || 1));

    const practiceRoomBookings = Array.from({ length: practiceRoomCount }, () => []);
    const interviewRoomAvailable = Array.from({ length: interviewRoomCount }, () => dayStart);
    const assistantAvailable = Array.from({ length: assistantsCount }, () => dayStart);
    const events = [];

    const getAvailablePracticeAllocation = (startTime, duration, studentCount) => {
      const endTime = startTime + duration;
      let remaining = Math.max(1, Number(studentCount || 0));
      const assignments = [];
      for (let roomIdx = 0; roomIdx < practiceRoomCount; roomIdx++) {
        const bookedCount = practiceRoomBookings[roomIdx]
          .filter(booking => Math.max(startTime, booking.start) < Math.min(endTime, booking.end))
          .reduce((sum, booking) => sum + booking.count, 0);
        const availableCount = practiceCapacityPerRoom - bookedCount;
        if (availableCount <= 0) continue;
        const assignedCount = Math.min(availableCount, remaining);
        assignments.push({ roomIdx, count: assignedCount });
        remaining -= assignedCount;
        if (remaining <= 0) break;
      }
      if (remaining > 0) return null;
      return { roomIndexes: assignments.map(item => item.roomIdx), assignments };
    };

    const reservePracticeRooms = (allocation, startTime, duration) => {
      if (!allocation?.assignments?.length) return;
      const endTime = startTime + duration;
      allocation.assignments.forEach(({ roomIdx, count }) => {
        practiceRoomBookings[roomIdx].push({ start: startTime, end: endTime, count });
      });
    };

    const formatPracticeRoomLabel = (roomIndexes) => {
      if (!roomIndexes?.length) return practiceRoomNames[0] || '實作教室';
      if (roomIndexes.length === 1) return practiceRoomNames[roomIndexes[0]] || `實作教室 ${roomIndexes[0] + 1}`;
      return roomIndexes.map(roomIdx => practiceRoomNames[roomIdx] || `實作教室 ${roomIdx + 1}`).join('、');
    };

    const getInterviewRoomLabel = (roomIndex) => interviewRoomNames[roomIndex] || `面試考場 ${roomIndex + 1}`;
    const failedGroups = [];
    const impossiblePracticeGroup = allGroups.find(group => group.students.length > practiceCapacityPerRoom * practiceRoomCount);
    if (impossiblePracticeGroup) {
      return { ok: false, error: `梯次 ${impossiblePracticeGroup.id} 有 ${impossiblePracticeGroup.students.length} 人，超過實作總容量 ${practiceCapacityPerRoom * practiceRoomCount} 人。` };
    }

    const previewGroupFit = (group) => {
      const slot = slots.find(item => Number(item.id) === group.slotId);
      if (!slot) return null;
      const slotEnd = parseTime(slot.end);
      let cursor = Math.max(slotEnd, dayStart);
      const interviewWorkMinutes = group.subGroups.length * interviewMinutes;
      const interviewBreakCount = Math.floor(Math.max(0, interviewWorkMinutes - 1) / interviewWorkBlock);
      const interviewTotal = interviewWorkMinutes + (interviewBreakCount * interviewBreakMinutes);
      const totalTime = practiceMinutes + transitMinutes + interviewTotal;
      const shouldWaitForLunchEnd = slotEnd >= lunchStart && slotEnd < lunchEndMins;
      const crossDeptBlocks = group.students
        .filter(student => student.isCrossDept && student.blockedStart && student.blockedEnd)
        .map(student => ({ start: parseTime(student.blockedStart), end: parseTime(student.blockedEnd) }))
        .filter(block => Number.isFinite(block.start) && Number.isFinite(block.end) && block.end > block.start);
      const preferredPattern = group.preferredPattern === 'I-P' ? 'I-P' : 'P-I';

      while (cursor <= dayEnd + 480) {
        if (shouldWaitForLunchEnd && cursor >= lunchStart && cursor < lunchEndMins) {
          cursor = lunchEndMins;
          continue;
        }
        const hasCrossDeptConflict = crossDeptBlocks.some(block => Math.max(cursor, block.start) < Math.min(cursor + totalTime, block.end));
        if (hasCrossDeptConflict) {
          cursor += 5;
          continue;
        }
        const pFirstPractice = getAvailablePracticeAllocation(cursor, practiceMinutes, group.students.length);
        const pFirstInterviewRoom = interviewRoomAvailable.findIndex(freeTime => freeTime <= cursor + practiceMinutes + transitMinutes);
        const pFirstAssistant = assistantAvailable.findIndex(freeTime => freeTime <= cursor);
        const iFirstInterviewRoom = interviewRoomAvailable.findIndex(freeTime => freeTime <= cursor);
        const iFirstPractice = getAvailablePracticeAllocation(cursor + interviewTotal + transitMinutes, practiceMinutes, group.students.length);
        const iFirstAssistant = assistantAvailable.findIndex(freeTime => freeTime <= cursor);
        if (preferredPattern === 'P-I' && pFirstPractice && pFirstInterviewRoom !== -1 && pFirstAssistant !== -1) {
          return { start: cursor, end: cursor + totalTime, slotEnd, roundNo: group.roundNo, tierNo: group.tierNo, teamNo: group.teamNo };
        }
        if (preferredPattern === 'I-P' && iFirstInterviewRoom !== -1 && iFirstPractice && iFirstAssistant !== -1) {
          return { start: cursor, end: cursor + totalTime, slotEnd, roundNo: group.roundNo, tierNo: group.tierNo, teamNo: group.teamNo };
        }
        cursor += 5;
      }
      return null;
    };

    const remainingGroups = [...allGroups];
    while (remainingGroups.length > 0) {
      let selectedIndex = -1;
      let selectedRank = null;
      remainingGroups.forEach((candidateGroup, idx) => {
        const rank = previewGroupFit(candidateGroup);
        if (!rank) return;
        const isBetter =
          !selectedRank ||
          rank.end < selectedRank.end ||
          (rank.end === selectedRank.end && rank.start < selectedRank.start) ||
          (rank.end === selectedRank.end && rank.start === selectedRank.start && rank.slotEnd < selectedRank.slotEnd) ||
          (rank.end === selectedRank.end && rank.start === selectedRank.start && rank.slotEnd === selectedRank.slotEnd && rank.roundNo < selectedRank.roundNo) ||
          (rank.end === selectedRank.end && rank.start === selectedRank.start && rank.slotEnd === selectedRank.slotEnd && rank.roundNo === selectedRank.roundNo && rank.tierNo < selectedRank.tierNo) ||
          (rank.end === selectedRank.end && rank.start === selectedRank.start && rank.slotEnd === selectedRank.slotEnd && rank.roundNo === selectedRank.roundNo && rank.tierNo === selectedRank.tierNo && rank.teamNo < selectedRank.teamNo);
        if (isBetter) {
          selectedRank = rank;
          selectedIndex = idx;
        }
      });

      if (selectedIndex === -1) {
        failedGroups.push(...remainingGroups.map(group => group.id));
        break;
      }

      const group = remainingGroups.splice(selectedIndex, 1)[0];
      const slot = slots.find(item => Number(item.id) === group.slotId);
      if (!slot) continue;
      const slotStart = parseTime(slot.start);
      const slotEnd = parseTime(slot.end);
      let t = Math.max(slotEnd, dayStart);
      const interviewWorkMinutes = group.subGroups.length * interviewMinutes;
      const interviewBreakCount = Math.floor(Math.max(0, interviewWorkMinutes - 1) / interviewWorkBlock);
      const interviewTotal = interviewWorkMinutes + (interviewBreakCount * interviewBreakMinutes);
      const totalTime = practiceMinutes + transitMinutes + interviewTotal;
      const shouldWaitForLunchEnd = slotEnd >= lunchStart && slotEnd < lunchEndMins;
      const crossDeptBlocks = group.students
        .filter(student => student.isCrossDept && student.blockedStart && student.blockedEnd)
        .map(student => ({ start: parseTime(student.blockedStart), end: parseTime(student.blockedEnd) }))
        .filter(block => Number.isFinite(block.start) && Number.isFinite(block.end) && block.end > block.start);

      const getWaitingEventType = (start, end) => (
        crossDeptBlocks.some(block => Math.max(start, block.start) < Math.min(end, block.end)) ? '跨系避開 / 候位' : '休息 / 準備移動'
      );
      const getPreActivityWaitingAssistant = (start, end) => (
        getWaitingEventType(start, end).includes('跨系') ? '行政報到組' : '考生休息室'
      );

      const findBestSlot = () => {
        let cursor = t;
        while (cursor <= dayEnd + 480) {
          if (shouldWaitForLunchEnd && cursor >= lunchStart && cursor < lunchEndMins) {
            cursor = lunchEndMins;
            continue;
          }
          const hasCrossDeptConflict = crossDeptBlocks.some(block => Math.max(cursor, block.start) < Math.min(cursor + totalTime, block.end));
          if (hasCrossDeptConflict) {
            cursor += 5;
            continue;
          }
          const pFirstPractice = getAvailablePracticeAllocation(cursor, practiceMinutes, group.students.length);
          const pFirstInterviewRoom = interviewRoomAvailable.findIndex(freeTime => freeTime <= cursor + practiceMinutes + transitMinutes);
          const pFirstAssistant = assistantAvailable.findIndex(freeTime => freeTime <= cursor);
          const pFirstOk = !!pFirstPractice && pFirstInterviewRoom !== -1 && pFirstAssistant !== -1;
          const iFirstInterviewRoom = interviewRoomAvailable.findIndex(freeTime => freeTime <= cursor);
          const iFirstPractice = getAvailablePracticeAllocation(cursor + interviewTotal + transitMinutes, practiceMinutes, group.students.length);
          const iFirstAssistant = assistantAvailable.findIndex(freeTime => freeTime <= cursor);
          const iFirstOk = iFirstInterviewRoom !== -1 && !!iFirstPractice && iFirstAssistant !== -1;
          const preferredPattern = group.preferredPattern === 'I-P' ? 'I-P' : 'P-I';
          if (preferredPattern === 'P-I' && pFirstOk) {
            return { start: cursor, pattern: 'P-I', pRooms: pFirstPractice.roomIndexes, pAllocation: pFirstPractice, iRoom: pFirstInterviewRoom, ast: pFirstAssistant };
          }
          if (preferredPattern === 'I-P' && iFirstOk) {
            return { start: cursor, pattern: 'I-P', pRooms: iFirstPractice.roomIndexes, pAllocation: iFirstPractice, iRoom: iFirstInterviewRoom, ast: iFirstAssistant };
          }
          cursor += 5;
        }
        return null;
      };

      const bestSlot = findBestSlot();
      if (!bestSlot) {
        failedGroups.push(group.id);
        continue;
      }

      events.push({
        groupId: group.id, region: group.region, type: '📝 報到與身分查驗',
        room: '系辦報到處 / 考生休息室', assistant: '行政報到組',
        startTime: formatTime(slotStart), endTime: formatTime(slotEnd),
        startTimeMins: slotStart, students: group.students, isRegistration: true
      });

      const assistantName = assistantNames[bestSlot.ast] || `工讀生 ${String.fromCharCode(65 + bestSlot.ast)}`;
      let currentEventTime = bestSlot.start;
      if (currentEventTime > slotEnd) {
        events.push({
          groupId: group.id, region: group.region, type: getWaitingEventType(slotEnd, currentEventTime),
          room: '考生休息室', assistant: getPreActivityWaitingAssistant(slotEnd, currentEventTime),
          startTime: formatTime(slotEnd), endTime: formatTime(currentEventTime),
          startTimeMins: slotEnd, students: [], isTransit: true
        });
      }

      const appendInterviewFlow = (startTime) => {
        let interviewTime = startTime;
        let accumulatedInterviewMinutes = 0;
        group.subGroups.forEach((subGroup, idx) => {
          events.push({
            groupId: group.id, region: group.region, type: '面試審查', batchInfo: subGroup.label,
            room: getInterviewRoomLabel(bestSlot.iRoom), assistant: assistantName,
            startTime: formatTime(interviewTime), endTime: formatTime(interviewTime + interviewMinutes),
            startTimeMins: interviewTime, students: subGroup.students
          });
          interviewTime += interviewMinutes;
          accumulatedInterviewMinutes += interviewMinutes;
          if (idx < group.subGroups.length - 1 && accumulatedInterviewMinutes >= interviewWorkBlock) {
            events.push({
              groupId: group.id, region: group.region, type: `面試休息 (${interviewBreakMinutes} 分鐘)`,
              room: getInterviewRoomLabel(bestSlot.iRoom), assistant: assistantName,
              startTime: formatTime(interviewTime), endTime: formatTime(interviewTime + interviewBreakMinutes),
              startTimeMins: interviewTime, students: [], isTransit: true
            });
            interviewTime += interviewBreakMinutes;
            accumulatedInterviewMinutes = 0;
          }
        });
        return interviewTime;
      };

      if (bestSlot.pattern === 'P-I') {
        events.push({
          groupId: group.id, region: group.region, type: '實作測驗',
          room: formatPracticeRoomLabel(bestSlot.pRooms), assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + practiceMinutes),
          startTimeMins: currentEventTime, students: group.students
        });
        currentEventTime += practiceMinutes;
        events.push({
          groupId: group.id, region: group.region, type: '換場移動',
          room: '依考場動線引導', assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + transitMinutes),
          startTimeMins: currentEventTime, students: group.students, isTransit: true
        });
        currentEventTime += transitMinutes;
        currentEventTime = appendInterviewFlow(currentEventTime);
        reservePracticeRooms(bestSlot.pAllocation, bestSlot.start, practiceMinutes);
        interviewRoomAvailable[bestSlot.iRoom] = bestSlot.start + totalTime;
        assistantAvailable[bestSlot.ast] = bestSlot.start + totalTime;
      } else {
        currentEventTime = appendInterviewFlow(currentEventTime);
        events.push({
          groupId: group.id, region: group.region, type: '換場移動',
          room: '依考場動線引導', assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + transitMinutes),
          startTimeMins: currentEventTime, students: group.students, isTransit: true
        });
        currentEventTime += transitMinutes;
        events.push({
          groupId: group.id, region: group.region, type: '實作測驗',
          room: formatPracticeRoomLabel(bestSlot.pRooms), assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + practiceMinutes),
          startTimeMins: currentEventTime, students: group.students
        });
        interviewRoomAvailable[bestSlot.iRoom] = bestSlot.start + interviewTotal;
        reservePracticeRooms(bestSlot.pAllocation, currentEventTime, practiceMinutes);
        assistantAvailable[bestSlot.ast] = bestSlot.start + totalTime;
      }
    }

    if (failedGroups.length > 0) {
      return { ok: false, error: `以下隊伍目前仍無法排入完整流程：\n${failedGroups.join('、')}\n\n請增加場地/人力，或調整學生報到時段後再重排。` };
    }

    const combined = [...events].sort((a, b) => a.startTimeMins - b.startTimeMins);
    const assistantConflicts = findAssistantConflicts(combined, assistantNames);
    if (assistantConflicts.length > 0) {
      return { ok: false, error: `偵測到工讀生同時間被安排到多件事情：\n${assistantConflicts.slice(0, 8).join('\n')}\n\n請增加工讀生或調整分法後再產生排程。` };
    }
    return {
      ok: true,
      students: currentStudents,
      schedule: {
        combined,
        grouped: buildGroupedFlow(events, assistantNames),
        strategyId: deptConfig.strategyId,
        strategyName: deptConfig.strategyName
      }
    };
  };

  const generateBufferPoolSchedule = (inputStudents, deptConfig) => {
    const slots = [...(deptConfig.registrationSlots || [])].sort((a, b) => parseTime(a.start) - parseTime(b.start));
    if (slots.length === 0) return { ok: false, error: '請至少設定一個報到時段。' };

    const launchSize = Math.max(1, Number(deptConfig.bufferPool?.launchSize || 10));
    const groupsPerTeam = Math.max(1, Number(deptConfig.bufferPool?.groupsPerTeam || 2));
    const studentsPerGroup = Math.max(1, Number(deptConfig.bufferPool?.studentsPerGroup || 5));
    const teamSize = groupsPerTeam * studentsPerGroup;
    const assistantsCount = Math.max(1, Number(deptConfig.resources?.assistants?.count || 1));
    const assistantNames = normalizeAssistantNames(deptConfig.resources?.assistants?.names, assistantsCount);
    const practiceRoomNames = normalizeRoomNames(deptConfig.resources?.practiceRooms?.names, deptConfig.resources?.practiceRooms?.count, '實作教室');
    const interviewRoomNames = normalizeRoomNames(deptConfig.resources?.interviewRooms?.names, deptConfig.resources?.interviewRooms?.count, '面試考場');
    const dayStart = parseTime(deptConfig.time?.dayStart || '08:00');
    const practiceMinutes = Number(deptConfig.time?.practiceMinutes || 40);
    const interviewMinutes = Number(deptConfig.time?.interviewMinutes || 10);
    const transitMinutes = Number(deptConfig.time?.transitMinutes || 10);
    const defaultPattern = deptConfig.bufferPool?.flowPattern === 'I-P' ? 'I-P' : 'P-I';

    let currentStudents = [...inputStudents];
    const slotIds = slots.map(slot => Number(slot.id));
    const slotCounts = Object.fromEntries(slotIds.map(id => [id, 0]));
    const assignedSlotsByIndex = new Map();
    currentStudents.forEach((student, idx) => {
      if (student.preferredSlot && slotCounts[student.preferredSlot] != null) {
        assignedSlotsByIndex.set(idx, student.preferredSlot);
        slotCounts[student.preferredSlot]++;
      }
    });
    currentStudents = currentStudents.map((student, idx) => {
      if (assignedSlotsByIndex.has(idx)) return { ...student, assignedSlot: assignedSlotsByIndex.get(idx) };
      const fallbackSlot = slotIds.reduce((minId, slotId) => (slotCounts[slotId] < slotCounts[minId] ? slotId : minId), slotIds[0]);
      slotCounts[fallbackSlot]++;
      return { ...student, assignedSlot: fallbackSlot };
    });

    const events = [];
    const grouped = [];
    let cursor = dayStart;
    let queueOrder = 0;
    slots.forEach((slot, slotIdx) => {
      const slotStudents = currentStudents.filter(student => Number(student.assignedSlot) === Number(slot.id));
      const readyTime = parseTime(slot.end);
      for (let i = 0; i < slotStudents.length; i += teamSize) {
        const teamStudents = slotStudents.slice(i, i + teamSize);
        if (!teamStudents.length) continue;
        queueOrder++;
        const teamNo = i / teamSize + 1;
        const groupId = `B${slotIdx + 1}-隊${teamNo}`;
        const pattern = (queueOrder % 2 === 0 && deptConfig.pipeline?.allowPatternSwap) ? (defaultPattern === 'P-I' ? 'I-P' : 'P-I') : defaultPattern;
        const assistantName = assistantNames[(queueOrder - 1) % assistantNames.length];
        const roomPractice = practiceRoomNames[(queueOrder - 1) % practiceRoomNames.length];
        const roomInterview = interviewRoomNames[(queueOrder - 1) % interviewRoomNames.length];
        const start = Math.max(cursor, readyTime);
        const interviewTotal = Math.ceil(teamStudents.length / launchSize) * interviewMinutes;
        let t = start;

        events.push({
          groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '📝 報到與身分查驗',
          room: '系辦報到處 / 考生休息室', assistant: '行政報到組',
          startTime: formatTime(parseTime(slot.start)), endTime: formatTime(readyTime),
          startTimeMins: parseTime(slot.start), students: teamStudents, isRegistration: true
        });

        if (pattern === 'I-P') {
          events.push({
            groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '面試審查',
            room: roomInterview, assistant: assistantName,
            startTime: formatTime(t), endTime: formatTime(t + interviewTotal),
            startTimeMins: t, students: teamStudents
          });
          t += interviewTotal;
          events.push({
            groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '換場移動',
            room: '依考場動線引導', assistant: assistantName,
            startTime: formatTime(t), endTime: formatTime(t + transitMinutes),
            startTimeMins: t, students: teamStudents, isTransit: true
          });
          t += transitMinutes;
          events.push({
            groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '實作測驗',
            room: roomPractice, assistant: assistantName,
            startTime: formatTime(t), endTime: formatTime(t + practiceMinutes),
            startTimeMins: t, students: teamStudents
          });
          t += practiceMinutes;
        } else {
          events.push({
            groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '實作測驗',
            room: roomPractice, assistant: assistantName,
            startTime: formatTime(t), endTime: formatTime(t + practiceMinutes),
            startTimeMins: t, students: teamStudents
          });
          t += practiceMinutes;
          events.push({
            groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '換場移動',
            room: '依考場動線引導', assistant: assistantName,
            startTime: formatTime(t), endTime: formatTime(t + transitMinutes),
            startTimeMins: t, students: teamStudents, isTransit: true
          });
          t += transitMinutes;
          events.push({
            groupId, region: teamStudents[0]?.region || '未分配 (其他)', type: '面試審查',
            room: roomInterview, assistant: assistantName,
            startTime: formatTime(t), endTime: formatTime(t + interviewTotal),
            startTimeMins: t, students: teamStudents
          });
          t += interviewTotal;
        }

        cursor = t;
        grouped.push({
          id: groupId,
          region: teamStudents[0]?.region || '未分配 (其他)',
          assistant: assistantName,
          allStudents: teamStudents,
          events: events.filter(event => event.groupId === groupId).sort((a, b) => a.startTimeMins - b.startTimeMins)
        });
      }
    });

    const combined = [...events].sort((a, b) => a.startTimeMins - b.startTimeMins);
    const assistantConflicts = findAssistantConflicts(combined, assistantNames);
    if (assistantConflicts.length > 0) {
      return { ok: false, error: `緩衝池模式出現工讀生重疊：\n${assistantConflicts.slice(0, 8).join('\n')}` };
    }

    return {
      ok: true,
      students: currentStudents,
      schedule: {
        combined,
        grouped,
        strategyId: `${deptConfig.strategyId}-buffer`,
        strategyName: `${deptConfig.strategyName}（緩衝池）`
      }
    };
  };

  const generateSchedule = (inputStudents, deptConfig) => {
    if (deptConfig?.mode === 'buffer_pool') return generateBufferPoolSchedule(inputStudents, deptConfig);
    return generatePipelineSchedule(inputStudents, deptConfig);
  };

  const handleGenerateSchedule = (strategyId = selectedScheduleStrategy) => {
    setShowStrategyModal(false);
    if (students.length === 0) { alert("請先匯入並解析學生資料！"); return; }
    if (registrationSlots.length === 0) { alert("請至少設定一個報到時段。"); return; }

    const deptConfig = buildDepartmentRuleConfig(strategyId);
    const result = generateSchedule(students, deptConfig);
    if (!result.ok) {
      alert(result.error || '排程失敗，請檢查設定後重試。');
      return;
    }
    setStudents(result.students);
    setSchedule(result.schedule);
    setActiveTab('schedule');
    setViewMode('table');
  };

  const isValidCloudUrl = (url) => url.includes("script.google.com/macros/s/");

  const fetchLatestCloudSnapshot = async () => {
    const url = `${cloudUrl}${cloudUrl.includes('?') ? '&' : '?'}action=getLatestSnapshot`;
    const res = await fetch(url, { method: 'GET' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json || !json.ok) {
      if (isNoSnapshotError(json?.error)) throw new Error('no_snapshot');
      throw new Error(json?.error || '找不到可用的雲端資料');
    }
    if (!json.data) throw new Error('找不到可用的雲端資料');
    return json.data;
  };

  const fetchDepartmentProfilesFromCloud = async () => {
    try {
      const json = await fetchCloudAction(cloudUrl, 'listDepartmentProfiles');
      const profiles = Array.isArray(json?.data?.departmentProfiles) ? json.data.departmentProfiles : [];
      if (profiles.length > 0) {
        return {
          departmentProfiles: profiles,
          selectedDepartmentId: json?.data?.selectedDepartmentId || ''
        };
      }
    } catch (error) {
      console.warn('listDepartmentProfiles 失敗，改用 getLatestSnapshot：', error);
    }
    const cloudData = await fetchLatestCloudSnapshot();
    return {
      departmentProfiles: Array.isArray(cloudData?.departmentProfiles) ? cloudData.departmentProfiles : [],
      selectedDepartmentId: cloudData?.selectedDepartmentId || ''
    };
  };

  const getProfilesNewestTime = (profiles) => Math.max(
    0,
    ...(Array.isArray(profiles) ? profiles.map(profile => Date.parse(profile?.updatedAt || '') || 0) : [])
  );

  const buildCloudPayload = () => {
    const currentProfileSnapshot = selectedDepartmentId
      ? buildDepartmentSnapshot(currentDepartment || { id: selectedDepartmentId, name: currentDepartment?.name || '未命名系所' })
      : null;
    const profilesForCloud = (departmentProfiles.length > 0 ? departmentProfiles : [createDepartmentProfile('資訊工程系')]).map(profile => {
      const source = currentProfileSnapshot && profile.id === selectedDepartmentId ? currentProfileSnapshot : profile;
      return normalizeDepartmentProfile(source);
    });
    const exportData = schedule.combined.map(item => ({
      "時間": `${item.startTime}-${item.endTime}`,
      "梯次": item.groupId,
      "項目": `${item.type} ${item.batchInfo || ''}`,
      "場地": item.room,
      "人員": item.assistant,
      "名單": item.students ? item.students.map(s => `${s.checkinNo || ''}-${s.name}${s.note ? `【${s.note}】` : ''}${s.subsidyReceived ? '【已領補助】' : ''}(${s.isCrossDept ? '跨' : ''})`).join(', ') : ''
    }));

    return {
      app: '4p-scheduler',
      version: 2,
      savedAt: new Date().toISOString(),
      localTime: new Date().toLocaleString('zh-TW', { hour12: false }),
      data: {
        departmentProfiles: profilesForCloud,
        selectedDepartmentId,
        department: currentDepartment ? { id: currentDepartment.id, name: currentDepartment.name } : null,
	        students, schedule, settings, registrationSlots, regions,
	        announcement: fieldAnnouncement,
	        taskConfirmations
      },
      scheduleRows: exportData
    };
  };

  // Google 雲端儲存 (透過 Google Apps Script Web App)
  const submitToGoogleCloud = async ({ silent = false, closeModal = true, trigger = 'manual' } = {}) => {
	    if (!isValidCloudUrl(cloudUrl)) {
	      if (!silent) alert("請輸入有效的 Google Apps Script 網址 (通常以 https://script.google.com/... 開頭)");
	      return false;
	    }
	    if (!isAdminMode) {
	      if (!silent) alert("為避免其他裝置覆蓋資料，只有管理員模式可以推送到 Google。一般模式會自動讀取雲端最新資料。");
	      return false;
	    }

	    if (trigger === 'auto') setIsAutoSyncing(true);
	    else setIsSaving(true);

	    try {
	      const payload = buildCloudPayload();
	      if (trigger === 'auto') {
	        try {
	          const latestCloudData = await fetchLatestCloudSnapshot();
	          const cloudProfiles = latestCloudData?.departmentProfiles || [];
	          const localProfiles = payload.data.departmentProfiles || [];
	          const cloudHasMoreDepartments = Array.isArray(cloudProfiles) && cloudProfiles.length > localProfiles.length;
	          const cloudIsNewer = getProfilesNewestTime(cloudProfiles) > getProfilesNewestTime(localProfiles) + 1000;
	          if (cloudHasMoreDepartments || cloudIsNewer) {
	            applyCloudSnapshot(latestCloudData);
	            setLastLiveSyncAt(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
	            return false;
	          }
	        } catch (guardError) {
	          if (isNoSnapshotError(guardError)) {
	            console.info('雲端尚未有第一筆快照，這次自動備份會直接建立初始資料。');
	          } else {
	          console.warn('自動備份前檢查雲端版本失敗，暫停本次上傳：', guardError);
	          return false;
	          }
	        }
	      }
	      const response = await fetch(cloudUrl, {
	        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'upsertSnapshot',
          payload
        })
      });

      const raw = await response.text();
      let json = null;
      try {
        json = JSON.parse(raw);
      } catch (_) {
        throw new Error('Web App 回傳非 JSON。請確認 Apps Script 有 doPost，且已重新部署。');
      }

      if (!response.ok || !json.ok) {
        throw new Error(json.error || `HTTP ${response.status}`);
      }

      const syncedAt = new Date().toLocaleString('zh-TW', { hour12: false });
      setLastCloudSyncAt(syncedAt);
      if (!silent) {
        alert("✅ 已同步完整資料到 Google 試算表！");
      }
      if (closeModal) setShowCloudModal(false);
      return true;
    } catch (error) {
      if (!silent) {
        alert(`❌ 備份失敗：${error.message}\n請確認 Apps Script 已部署為 Web App，且允許「任何人」存取。`);
      } else {
        console.warn('自動備份失敗：', error);
      }
      return false;
    } finally {
      if (trigger === 'auto') setIsAutoSyncing(false);
      else setIsSaving(false);
    }
  };

	  const applyCloudSnapshot = (cloudData) => {
	    if (!cloudData || typeof cloudData !== 'object') return;

	    if (Array.isArray(cloudData.departmentProfiles) && cloudData.departmentProfiles.length > 0) {
	      const normalizedProfiles = cloudData.departmentProfiles.map((profile, idx) => normalizeDepartmentProfile(profile, idx));
	      setDepartmentProfiles(normalizedProfiles);

	      if (selectedDepartmentId) {
	        const target =
	          normalizedProfiles.find(profile => profile.id === selectedDepartmentId) ||
	          normalizedProfiles.find(profile => profile.id === cloudData.selectedDepartmentId) ||
	          normalizedProfiles[0];
	        if (target) applyDepartmentProfile(target);
	      }
	      return;
	    }

	    if (cloudData.students) setStudents(ensureStudentCheckinNos(cloudData.students));
	    if (cloudData.schedule) setSchedule(ensureScheduleShape(cloudData.schedule));
	    if (cloudData.settings) setSettings(cloudData.settings);
	    if (cloudData.registrationSlots) setRegistrationSlots(cloudData.registrationSlots);
	    if (cloudData.regions) setRegions(cloudData.regions);
	    if (typeof cloudData.announcement === 'string') setFieldAnnouncement(cloudData.announcement);
	    if (cloudData.taskConfirmations && typeof cloudData.taskConfirmations === 'object') setTaskConfirmations(cloudData.taskConfirmations);
	  };

	  const loadFromGoogleCloud = async ({ silent = false } = {}) => {
		    if (!isValidCloudUrl(cloudUrl)) {
		      if (!silent) alert("請先貼上有效的 Google Apps Script 網址。");
		      return false;
	    }

	    setIsLoadingCloud(true);
	    try {
		      const cloudData = await fetchLatestCloudSnapshot();
		      applyCloudSnapshot(cloudData);

	      const syncedAt = new Date().toLocaleString('zh-TW', { hour12: false });
	      setLastCloudSyncAt(syncedAt);
	      if (!silent) alert("✅ 已從 Google 雲端載入最新資料。");
	      return true;
	    } catch (error) {
	      if (!silent) {
	        if (isNoSnapshotError(error)) {
	          alert('ℹ️ Google 雲端目前還沒有第一筆快照。\n請先用管理員模式按一次「推送到 Google」，之後其他裝置就能同步讀取。');
	        } else {
	        alert(`❌ 載入失敗：${error.message}\n請確認您的 Apps Script 有實作 action=getLatestSnapshot。`);
	        }

    const timeMap = new Map();
    items.forEach((item) => {
      const key = `${item.startTime}-${item.endTime}`;
      if (!timeMap.has(key)) {
        timeMap.set(key, {
          startTime: item.startTime,
          endTime: item.endTime,
          startTimeMins: item.startTimeMins,
          entries: []
        });
      }
      timeMap.get(key).entries.push(item);
    });

    const mergeEntries = (entries) => {
      const mergedMap = new Map();
      entries.forEach((entry) => {
        const key = `${entry.assistant}__${entry.type}__${entry.room}`;
        if (!mergedMap.has(key)) {
          mergedMap.set(key, {
            assistant: entry.assistant,
            type: entry.type,
            room: entry.room,
            groupIds: [],
            students: [],
            studentIds: new Set(),
            batchInfos: []
          });
        }
        const merged = mergedMap.get(key);
        if (entry.groupId && !merged.groupIds.includes(entry.groupId)) {
          merged.groupIds.push(entry.groupId);
        }
        if (entry.batchInfo && !merged.batchInfos.includes(entry.batchInfo)) {
          merged.batchInfos.push(entry.batchInfo);

          if (!merged.studentIds.has(student.id)) {

            merged.students.push(student);
          }
        });
      });

      return Array.from(mergedMap.values()).map(({ studentIds, ...rest }) => rest);

	                      <td className="border border-black p-2"></td>
	                      <td className="border border-black p-2"></td>
	                      <td className="border border-black p-2"></td>
	                      <td className="border border-black p-2"></td>
	                      <td className="border border-black p-2"></td>
	                      <td className="border border-black p-2"></td>
	                    </tr>
	                  ))}
	                </tbody>
	              </table>

	              <div className="mt-4 grid grid-cols-2 gap-4 text-sm">
	                <div className="border border-black p-3 min-h-[72px]">
	                  <div className="font-bold mb-2">現場確認</div>
	                  <div>□ 身分已核對　□ 資料已更新　□ 補助已發放</div>
	                </div>
	                <div className="border border-black p-3 min-h-[72px]">
	                  <div className="font-bold mb-2">備註欄</div>
	                </div>
	              </div>
	            </div>
	          ))}
        </div>
      )}
    </>
  );
};

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, message: '', stack: '' };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, message: String(error?.message || error || '未知錯誤') };
  }

  componentDidCatch(error, info) {
    this.setState({
      stack: String(info?.componentStack || '')
    });
    console.error('UI Render Error:', error, info);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-slate-100 p-6">
          <div className="max-w-4xl mx-auto bg-white border border-rose-200 rounded-2xl shadow p-6">
            <h1 className="text-2xl font-bold text-rose-700 mb-3">畫面載入失敗</h1>
            <p className="text-slate-700 mb-2">已攔截到前端錯誤，請把下面訊息貼給我，我會立即修正。</p>
            <pre className="text-xs bg-rose-50 border border-rose-200 rounded-lg p-3 overflow-auto whitespace-pre-wrap">{this.state.message}</pre>
            {this.state.stack && (
              <pre className="mt-3 text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-auto whitespace-pre-wrap">{this.state.stack}</pre>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}


      const root = createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
