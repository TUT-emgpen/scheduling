const App = () => {
  const ADMIN_PASSWORD_KEY = 'schedulerAdminPasswordHash';

  const getSafeStorage = () => {
    try {
      if (typeof window === 'undefined') return null;
      const s = window.localStorage;
      const k = '__scheduler_storage_probe__';
      s.setItem(k, '1');
      s.removeItem(k);
      return s;
    } catch (_) {
      return null;
    }
  };

  const safeStorageGet = (key) => {
    try {
      const s = getSafeStorage();
      return s ? s.getItem(key) : null;
    } catch (_) {
      return null;
    }
  };

	  const safeStorageSet = (key, value) => {
	    try {
	      const s = getSafeStorage();
	      if (!s) return false;
	      s.setItem(key, value);
	      return true;
	    } catch (_) {
	      return false;
	    }
	  };

	  const encodeSharePayload = (payload) => {
	    const json = JSON.stringify(payload);
	    const bytes = new TextEncoder().encode(json);
	    let binary = '';
	    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
	    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
	  };

	  const decodeSharePayload = (encoded) => {
	    try {
	      if (!encoded) return null;
	      const normalized = encoded.replace(/-/g, '+').replace(/_/g, '/');
	      const padded = normalized.padEnd(normalized.length + ((4 - normalized.length % 4) % 4), '=');
	      const binary = atob(padded);
	      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
	      return JSON.parse(new TextDecoder().decode(bytes));
	    } catch (error) {
	      console.error('工讀生連結資料解析失敗', error);
	      return null;
	    }
	  };

	  const getAssistantSharePayloadFromUrl = () => {
	    try {
	      const params = new URLSearchParams(window.location.search);
	      if (params.get('assistantCard') !== '1') return null;
	      const hashParams = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
	      return decodeSharePayload(hashParams.get('data'));
	    } catch (error) {
	      console.error('讀取工讀生連結失敗', error);
	      return null;
	    }
	  };

  const hashAdminPassword = (value) => {
    const input = `4p-scheduler-admin::${value}`;
    let h1 = 0xdeadbeef;
    let h2 = 0x41c6ce57;
    for (let i = 0; i < input.length; i++) {
      const ch = input.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return `${(h2 >>> 0).toString(16).padStart(8, '0')}${(h1 >>> 0).toString(16).padStart(8, '0')}`;
  };

  const ensureScheduleShape = (rawSchedule) => {
    if (!rawSchedule || typeof rawSchedule !== 'object') {
      return { combined: [], grouped: [] };
    }
    return {
      combined: Array.isArray(rawSchedule.combined) ? rawSchedule.combined : [],
      grouped: Array.isArray(rawSchedule.grouped) ? rawSchedule.grouped : []
    };
  };

	  const ensureStudentCheckinNos = (list) => {
	    return (list || []).map((s, idx) => ({
	      ...s,
	      checkinNo: s.checkinNo != null && String(s.checkinNo).trim() !== ''
	        ? String(s.checkinNo).trim()
	        : String(idx + 1).padStart(3, '0'),
	      checkinStatus: CHECKIN_STATUS_OPTIONS.includes(s.checkinStatus) ? s.checkinStatus : '未報到'
	    }));
	  };

  const normalizeDepartmentProfile = (profile, idx = 0) => ({
    id: profile?.id || `dept-${Date.now()}-${idx}`,
    name: profile?.name || `系所 ${idx + 1}`,
    cloudUrl: profile?.cloudUrl || DEFAULT_CLOUD_URL,
    students: ensureStudentCheckinNos(profile?.students || []),
    schedule: ensureScheduleShape(profile?.schedule),
    settings: {
      ...DEFAULT_SETTINGS,
      ...(profile?.settings || {}),
      assistantNames: normalizeAssistantNames(profile?.settings?.assistantNames || DEFAULT_SETTINGS.assistantNames, profile?.settings?.assistantsCount || DEFAULT_SETTINGS.assistantsCount)
    },
	    registrationSlots: Array.isArray(profile?.registrationSlots) && profile.registrationSlots.length > 0 ? profile.registrationSlots : DEFAULT_REGISTRATION_SLOTS,
	    regions: Array.isArray(profile?.regions) && profile.regions.length > 0 ? profile.regions : DEFAULT_REGIONS,
	    announcement: profile?.announcement || '',
	    taskConfirmations: profile?.taskConfirmations && typeof profile.taskConfirmations === 'object' ? profile.taskConfirmations : {},
	    updatedAt: profile?.updatedAt || new Date().toISOString()
	  });

  const normalizeAssistantNames = (names, count) => {
    const total = Math.max(1, Number(count) || 1);
    return Array.from({ length: total }, (_, idx) => {
      const value = Array.isArray(names) ? names[idx] : '';
      return value != null && String(value).trim() !== '' ? String(value).trim() : `工讀生 ${String.fromCharCode(65 + idx)}`;
    });
  };

  const createDepartmentProfile = (name, source = {}) => normalizeDepartmentProfile({
    ...source,
    id: `dept-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    name,
    updatedAt: new Date().toISOString()
  });

  const formatStudentLabel = (student) => {
    const no = student?.checkinNo ? `${student.checkinNo} ` : '';
    const suffix = student?.id ? ` ${String(student.id).slice(-4)}` : '';
    return `${no}${student?.name || ''}${suffix}`.trim();
  };

  const getAssistantColor = (assistantName, assistantNames = []) => {
    const m = String(assistantName || '').match(/工讀生\s*([A-Z])/i);
    let idx = -1;
    if (m) {
      idx = m[1].toUpperCase().charCodeAt(0) - 65;
    } else {
      idx = assistantNames.findIndex(name => name === assistantName);
    }
    if (idx < 0) return ASSISTANT_NEUTRAL_STYLE;
    idx = idx % ASSISTANT_COLOR_PALETTE.length;
    return ASSISTANT_COLOR_PALETTE[Math.max(0, idx)];
  };

  const [activeTab, setActiveTab] = useState('import');
  const [importMode, setImportMode] = useState('students'); 
  const [rawData, setRawData] = useState('');
  const [slotRawData, setSlotRawData] = useState('');
  
	  const [students, setStudents] = useState([]);
	  const [schedule, setSchedule] = useState({ combined: [], grouped: [] });
		  const [viewMode, setViewMode] = useState('cards');
		  const [mobileAssistantFilter, setMobileAssistantFilter] = useState('all');
		  const [copiedAssistantName, setCopiedAssistantName] = useState('');
		  const [fieldAnnouncement, setFieldAnnouncement] = useState('');
		  const [studentSearchQuery, setStudentSearchQuery] = useState('');
		  const [taskConfirmations, setTaskConfirmations] = useState({});
		  const [lastLiveSyncAt, setLastLiveSyncAt] = useState('');
		  const [isAdminMode, setIsAdminMode] = useState(false);
  const [showAdminModal, setShowAdminModal] = useState(false);
  const [adminPasswordInput, setAdminPasswordInput] = useState('');
  const [adminError, setAdminError] = useState('');
  const [adminPasswordHash, setAdminPasswordHash] = useState(() => safeStorageGet(ADMIN_PASSWORD_KEY) || '');
  const [departmentProfiles, setDepartmentProfiles] = useState([]);
  const [selectedDepartmentId, setSelectedDepartmentId] = useState(null);
  const [departmentDraftName, setDepartmentDraftName] = useState('');
  
  // 雲端存檔相關 State
  const [showCloudModal, setShowCloudModal] = useState(false);
  const [cloudUrl, setCloudUrl] = useState(DEFAULT_CLOUD_URL);
  const [isSaving, setIsSaving] = useState(false);
  const [isLoadingCloud, setIsLoadingCloud] = useState(false);
  const [isAutoSyncing, setIsAutoSyncing] = useState(false);
  const [autoBackupEnabled, setAutoBackupEnabled] = useState(false);
  const [autoBackupMinutes, setAutoBackupMinutes] = useState(5);
  const [lastCloudSyncAt, setLastCloudSyncAt] = useState('');

  const [settings, setSettings] = useState(DEFAULT_SETTINGS);

  const [registrationSlots, setRegistrationSlots] = useState(DEFAULT_REGISTRATION_SLOTS);

  const [regions, setRegions] = useState(DEFAULT_REGIONS);

  const [activeRegionId, setActiveRegionId] = useState(1);
  const [isInitialized, setIsInitialized] = useState(false);

  const handleAdminSubmit = (e) => {
    e.preventDefault();
    const password = adminPasswordInput.trim();
    if (password.length < 6) {
      setAdminError('管理密碼至少需要 6 個字元。');
      return;
    }

    const nextHash = hashAdminPassword(password);
    if (!adminPasswordHash) {
      setAdminPasswordHash(nextHash);
      safeStorageSet(ADMIN_PASSWORD_KEY, nextHash);
      setIsAdminMode(true);
      setShowAdminModal(false);
      setAdminPasswordInput('');
      setAdminError('');
      return;
    }

    if (nextHash !== adminPasswordHash) {
      setAdminError('管理密碼不正確。');
      return;
    }

    setIsAdminMode(true);
    setShowAdminModal(false);
    setAdminPasswordInput('');
    setAdminError('');
  };

  const handleAdminLogout = () => {
    setIsAdminMode(false);
    setAdminPasswordInput('');
    setAdminError('');
  };

  const currentDepartment = departmentProfiles.find(d => d.id === selectedDepartmentId);

	  const buildDepartmentSnapshot = (baseProfile = {}) => ({
	    ...baseProfile,
	    cloudUrl,
	    students: ensureStudentCheckinNos(students),
	    schedule: ensureScheduleShape(schedule),
	    settings,
	    registrationSlots,
	    regions,
	    announcement: fieldAnnouncement,
	    taskConfirmations,
	    updatedAt: new Date().toISOString()
	  });

  const applyDepartmentProfile = (profile) => {
    const normalized = normalizeDepartmentProfile(profile);
    setCloudUrl(normalized.cloudUrl);
    setStudents(normalized.students);
	    setSchedule(normalized.schedule);
	    setSettings(normalized.settings);
	    setRegistrationSlots(normalized.registrationSlots);
	    setRegions(normalized.regions);
	    setFieldAnnouncement(normalized.announcement || '');
	    setTaskConfirmations(normalized.taskConfirmations || {});
	    setActiveTab('import');
    setViewMode('cards');
    setSelectedDepartmentId(normalized.id);
  };

  const persistCurrentDepartment = () => {
    if (!selectedDepartmentId) return;
    setDepartmentProfiles(prev => prev.map(profile => (
      profile.id === selectedDepartmentId ? buildDepartmentSnapshot(profile) : profile
    )));
  };

  const enterDepartment = (profileId) => {
    persistCurrentDepartment();
    const target = departmentProfiles.find(profile => profile.id === profileId);
    if (target) applyDepartmentProfile(target);
  };

  const backToDepartments = () => {
    persistCurrentDepartment();
    setSelectedDepartmentId(null);
  };

  const addDepartmentProfile = () => {
    if (!isAdminMode) return;
    const name = departmentDraftName.trim();
    if (!name) {
      alert('請先輸入系所名稱。');
      return;
    }
    const nextProfile = createDepartmentProfile(name);
    setDepartmentProfiles(prev => [...prev, nextProfile]);
    setDepartmentDraftName('');
  };

  const copyDepartmentProfile = (profileId) => {
    if (!isAdminMode) return;
    const source = departmentProfiles.find(profile => profile.id === profileId);
    if (!source) return;
    const copied = createDepartmentProfile(`${source.name} 複本`, {
      ...source,
      id: undefined,
      students: [],
      schedule: { combined: [], grouped: [] }
    });
    setDepartmentProfiles(prev => [...prev, copied]);
  };

  const renameDepartmentProfile = (profileId) => {
    if (!isAdminMode) return;
    const source = departmentProfiles.find(profile => profile.id === profileId);
    if (!source) return;
    const nextName = prompt('請輸入新的系所名稱', source.name);
    if (nextName == null) return;
    const trimmed = nextName.trim();
    if (!trimmed) {
      alert('系所名稱不能空白。');
      return;
    }
    setDepartmentProfiles(prev => prev.map(profile => (
      profile.id === profileId ? { ...profile, name: trimmed, updatedAt: new Date().toISOString() } : profile
    )));
  };

  const deleteDepartmentProfile = (profileId) => {
    if (!isAdminMode) return;
    const source = departmentProfiles.find(profile => profile.id === profileId);
    if (!source) return;
    if (departmentProfiles.length <= 1) {
      alert('至少需要保留一個系所。');
      return;
    }
    const ok = confirm(`確定要刪除「${source.name}」嗎？\n這會移除此系所的學生資料、設定與排程。`);
    if (!ok) return;
    setDepartmentProfiles(prev => prev.filter(profile => profile.id !== profileId));
    if (selectedDepartmentId === profileId) {
      setSelectedDepartmentId(null);
    }
  };

  const addRegistrationSlot = () => {
    const sorted = [...registrationSlots].sort((a, b) => parseTime(a.start) - parseTime(b.start));
    const last = sorted[sorted.length - 1];
    const nextId = registrationSlots.reduce((m, s) => Math.max(m, s.id), 0) + 1;
    let nextStart = '17:00';
    let nextEnd = '17:30';
    if (last) {
      const lastStart = parseTime(last.start);
      const lastEnd = parseTime(last.end);
      const len = Math.max(10, lastEnd - lastStart);
      const newStart = Math.min(23 * 60 + 30, lastEnd + 30);
      const newEnd = Math.min(23 * 60 + 59, newStart + len);
      nextStart = formatTime(newStart);
      nextEnd = formatTime(newEnd);
    }
    setRegistrationSlots([...registrationSlots, { id: nextId, start: nextStart, end: nextEnd, name: `時段 ${registrationSlots.length + 1}` }]);
  };

  const removeRegistrationSlot = (slotId) => {
    if (registrationSlots.length <= 1) return;
    const kept = registrationSlots.filter(s => s.id !== slotId);
    setRegistrationSlots(kept.map((s, idx) => ({ ...s, name: `時段 ${idx + 1}` })));
    setStudents(prev => prev.map(st => {
      if (st.preferredSlot === slotId || st.assignedSlot === slotId) {
        return { ...st, preferredSlot: null, assignedSlot: null };
      }
      return st;
    }));
  };

  // 系統初始化：從 LocalStorage 載入上次的資料
  useEffect(() => { 
    if (!window.XLSX) {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      script.async = true;
      document.body.appendChild(script);
    }

    const savedDepartments = safeStorageGet('departmentProfilesData');
    let nextProfiles = [];
    if (savedDepartments) {
      try {
        const parsedDepartments = JSON.parse(savedDepartments);

    const reader = new FileReader();
    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      if (window.XLSX) {
        try {
          const wb = window.XLSX.read(data, { type: 'array' });
          const wsname = wb.SheetNames[0];
          const csvStr = window.XLSX.utils.sheet_to_csv(wb.Sheets[wsname]);
          if (targetMode === 'students') {
             setRawData(csvStr);
             alert(`已成功讀取「${file.name}」！請點擊下方「解析名單」。`);
          } else {
             setSlotRawData(csvStr);
             alert(`已成功讀取「${file.name}」！請點擊下方「比對並更新」。`);
          }
        } catch (err) {
          alert('檔案解析失敗，請確認檔案格式。');
        }
      } else { alert('Excel 引擎正在載入，請稍後再試。'); }
    };
    reader.readAsArrayBuffer(file);

  const handleParseData = () => {
    const lines = rawData.trim().split('\n');
    if (lines.length < 2) return;

    const headers = lines[0].split(',').map(h => h.trim());
    let idIdx = headers.indexOf('報名序號');
    let nameIdx = headers.indexOf('姓名');
    let addrIdx = headers.indexOf('地址');
    let cityIdx = headers.indexOf('縣市');

    if (idIdx === -1) idIdx = 0;
    if (nameIdx === -1) nameIdx = 1;
    if (cityIdx !== -1) addrIdx = cityIdx;
    else if (addrIdx === -1) addrIdx = 2;

    const parsedStudents = [];
    let startIndex = isNaN(parseInt(lines[0].split(',')[0])) ? 1 : 0;

    for (let i = startIndex; i < lines.length; i++) {
      const parts = lines[i].split(','); 
      if (parts.length < 3) continue;
      const id = parts[idIdx]?.trim();
      const name = parts[nameIdx]?.trim();
      const address = parts[addrIdx]?.trim() || '';

      let rawCity = '未知';
      const cityMatch = address.match(/^(.{2,3}[縣市])/);
      if (cityMatch) rawCity = cityMatch[1];
      else rawCity = address.substring(0, 3);
      
      const city = normalizeCityName(rawCity);
      let regionAssigned = '未分配 (其他)';
      let regionOrder = 999;
      
      for (let rIdx = 0; rIdx < regions.length; rIdx++) {
        if (regions[rIdx].counties.includes(city)) {
          regionAssigned = regions[rIdx].name;
          regionOrder = rIdx; break;
        }
      }
      if (id && name) {
        parsedStudents.push({ 
	          id, name, city, region: regionAssigned, regionOrder,
	          isCrossDept: false, blockedStart: '10:00', blockedEnd: '12:00',
	          preferredSlot: null, assignedSlot: null, checkinStatus: '未報到'
	        });
      }
    }
    
    parsedStudents.sort((a, b) => {
      if (a.regionOrder !== b.regionOrder) return a.regionOrder - b.regionOrder;
      return a.id.localeCompare(b.id);
    });

    setStudents(ensureStudentCheckinNos(parsedStudents));
    alert(`成功解析 ${parsedStudents.length} 筆學生資料！`);
  };

  const handleParseSlots = () => {
    if (students.length === 0) {

    }
    const lines = slotRawData.trim().split('\n');
    let startIndex = isNaN(parseInt(lines[0].split(',')[0])) ? 1 : 0;
    let matchCount = 0;
    const updatedStudents = [...students];
    const validSlotIds = new Set(registrationSlots.map(s => Number(s.id)));

    for (let i = startIndex; i < lines.length; i++) {
      const parts = lines[i].split(','); 
      if (parts.length < 2) continue;
      const id = parts[0]?.trim();
      const slotNum = parseInt(parts[1]?.trim());

      if (id && !isNaN(slotNum) && validSlotIds.has(slotNum)) {
        const studentIndex = updatedStudents.findIndex(s => s.id === id);
        if (studentIndex !== -1) {
          updatedStudents[studentIndex].preferredSlot = slotNum;
          matchCount++;
        }
      }
    }
    setStudents(ensureStudentCheckinNos(updatedStudents));
    alert(`成功比對並更新 ${matchCount} 筆報到意願！`);
    setActiveTab('students');

    }));

	  const copyTextToClipboard = async (text) => {

	    }
	    const textarea = document.createElement('textarea');
	    textarea.value = text;

	    textarea.style.position = 'fixed';
	    textarea.style.left = '-9999px';
	    document.body.appendChild(textarea);
	    textarea.select();
	    const ok = document.execCommand('copy');

		                    <div className="space-y-1.5">
		                      {(info.events || []).map((ev, evIdx) => {

	                      <span className={`text-xs font-bold ${assistantColor.accentText} ${assistantColor.accentSoftBg} border ${assistantColor.accentBorder} px-2 py-1 rounded-md`}>{info.allStudents.length} 人</span>
	                    </div>
		                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-1.5">
	                      {info.allStudents.map(s => (
		                        <span key={`${info.id}-${s.id}`} className={`text-sm border px-3 py-2 rounded-lg flex items-center justify-between gap-2 font-bold ${s.isCrossDept ? 'bg-orange-50 border-orange-200 text-orange-700' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
		                          <span className="min-w-0 truncate flex items-center">
		                            {s.isCrossDept && <AlertTriangle size={12} className="mr-1.5 shrink-0" />}
		                            {formatStudentLabel(getCurrentStudent(s))}

	                    </div>

	      </div>
	    </div>
	    );
	  };

	  const parseTime = (timeStr) => { const [h, m] = timeStr.split(':').map(Number); return h * 60 + m; };
  const formatTime = (minutes) => { const h = Math.floor(minutes / 60); const m = minutes % 60; return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`; };

  const handleGenerateSchedule = () => {
    if (students.length === 0) { alert("請先匯入並解析學生資料！"); return; }
    if (registrationSlots.length === 0) { alert("請至少設定一個報到時段。"); return; }

    const ROUND_COUNT = 4;
    const TIERS_PER_ROUND = 2;
    const BASE_TEAMS_PER_TIER = 2;
    const GROUPS_PER_TEAM = 2;
    const STUDENTS_PER_GROUP = 5;
    const assistantsCount = Math.max(1, Number(settings.assistantsCount || 1));
    if (assistantsCount < TIERS_PER_ROUND * BASE_TEAMS_PER_TIER) {
      alert(`此模式需至少 ${TIERS_PER_ROUND * BASE_TEAMS_PER_TIER} 位工讀生，才能達成「一位工讀生帶一隊」。`);
      return;
    }
    const teamsPerTier = BASE_TEAMS_PER_TIER + Math.floor(Math.max(0, assistantsCount - (TIERS_PER_ROUND * BASE_TEAMS_PER_TIER)) / TIERS_PER_ROUND);
    const STUDENTS_PER_TIER = teamsPerTier * GROUPS_PER_TEAM * STUDENTS_PER_GROUP;
    const STUDENTS_PER_ROUND = TIERS_PER_ROUND * STUDENTS_PER_TIER;

    if (registrationSlots.length !== ROUND_COUNT) {
      alert(`目前設定了 ${registrationSlots.length} 個報到時段。\n此模式固定為一天 ${ROUND_COUNT} 輪，請先將報到時段調整為 ${ROUND_COUNT} 個後再產生排程。`);
      return;
    }

	    let currentStudents = [...students];
	    const sortedSlots = [...registrationSlots].sort((a, b) => parseTime(a.start) - parseTime(b.start));
	    const slotIds = sortedSlots.map(s => Number(s.id));
	    const slotCounts = Object.fromEntries(slotIds.map(id => [id, 0]));
	    const assignedSlotsByIndex = new Map();
	    const afternoonStartTime = Math.max(parseTime(settings.lunchEnd), 12 * 60);

	    const findLeastFilledSlot = (possibleSlots = slotIds) => {
	      if (possibleSlots.length === 0) return null;
	      let minSlot = possibleSlots[0];
	      for (let i = 1; i < possibleSlots.length; i++) {
	        if (slotCounts[possibleSlots[i]] < slotCounts[minSlot]) minSlot = possibleSlots[i];
	      }
	      return minSlot;
	    };

	    const findCrossDeptPreferredSlot = (student) => {
	      if (!student.isCrossDept) return null;
	      const blockedEnd = parseTime(student.blockedEnd || '');
	      const readyTime = Number.isFinite(blockedEnd) ? Math.max(blockedEnd, afternoonStartTime) : afternoonStartTime;
	      const afternoonSlots = sortedSlots
	        .filter(slot => parseTime(slot.start) >= readyTime)
	        .map(slot => Number(slot.id));
	      if (afternoonSlots.length === 0) return null;
	      const availableSlot = afternoonSlots.find(slotId => slotCounts[slotId] < STUDENTS_PER_ROUND);
	      return availableSlot || afternoonSlots[0];
	    };

	    currentStudents.forEach((student, idx) => {
	      const crossDeptSlot = findCrossDeptPreferredSlot(student);
	      if (crossDeptSlot) {
	        assignedSlotsByIndex.set(idx, crossDeptSlot);
	        slotCounts[crossDeptSlot]++;
	      }
	    });

	    currentStudents.forEach((student, idx) => {
	      if (assignedSlotsByIndex.has(idx)) return;
	      if (student.preferredSlot && slotCounts[student.preferredSlot] != null) {
	        assignedSlotsByIndex.set(idx, student.preferredSlot);
	        slotCounts[student.preferredSlot]++;
	      }
	    });

	    currentStudents = currentStudents.map((student, idx) => {
	      if (assignedSlotsByIndex.has(idx)) {
	        return { ...student, assignedSlot: assignedSlotsByIndex.get(idx) };
	      }
	      const minSlot = findLeastFilledSlot();
	      if (!minSlot) return { ...student, assignedSlot: null };
	      slotCounts[minSlot]++;
	      return { ...student, assignedSlot: minSlot };
	    });
    setStudents(currentStudents); 

    const overloadedSlots = sortedSlots
      .map(slot => {
        const count = currentStudents.filter(s => s.assignedSlot === Number(slot.id)).length;
        return { slot, count };
      })
      .filter(({ count }) => count > STUDENTS_PER_ROUND);
    if (overloadedSlots.length > 0) {
      const msg = overloadedSlots.map(({ slot, count }) => `${slot.name}：${count} 人（上限 ${STUDENTS_PER_ROUND}）`).join('\n');
      alert(`固定四輪模式下，每輪最多 ${STUDENTS_PER_ROUND} 人。\n以下輪次超過上限：\n${msg}\n\n請調整學生報到時段後再重排。`);
      return;
    }

    const getMainRegion = (studentsArray) => {
      if (studentsArray.length === 0) return '未分配 (其他)';
      const regionCounter = {};
      studentsArray.forEach(s => {
        regionCounter[s.region] = (regionCounter[s.region] || 0) + 1;
      });
      return Object.entries(regionCounter).sort((a, b) => b[1] - a[1])[0][0];
    };

    const buildTierSubGroups = (tierStudents, teamsCount) => {
      const subGroups = [];
      for (let teamIdx = 0; teamIdx < teamsCount; teamIdx++) {
        for (let groupIdx = 0; groupIdx < GROUPS_PER_TEAM; groupIdx++) {
          const groupOrder = (teamIdx * GROUPS_PER_TEAM) + groupIdx;
          const startIndex = groupOrder * STUDENTS_PER_GROUP;
          const members = tierStudents.slice(startIndex, startIndex + STUDENTS_PER_GROUP);
          if (members.length === 0) continue;
          subGroups.push({
            label: `第 ${teamIdx + 1} 隊・第 ${groupIdx + 1} 組`,
            team: teamIdx + 1,
            group: groupIdx + 1,
            students: members
          });
        }
      }
      return subGroups;
    };

    const allGroups = [];
    sortedSlots.forEach((slot, roundIdx) => {
      const roundNo = roundIdx + 1;
      const slotId = Number(slot.id);
      const roundStudents = currentStudents.filter(s => s.assignedSlot === slotId);
      const tierAStudents = roundStudents.slice(0, STUDENTS_PER_TIER);
      const tierBStudents = roundStudents.slice(STUDENTS_PER_TIER, STUDENTS_PER_TIER * 2);

      const tiers = [
        { key: 'A', pattern: 'I-P', students: tierAStudents, tierNo: 1 },
        { key: 'B', pattern: 'P-I', students: tierBStudents, tierNo: 2 }
      ];

      tiers.forEach(tier => {
        if (tier.students.length === 0) return;
        const tierSubGroups = buildTierSubGroups(tier.students, teamsPerTier);
        for (let teamNo = 1; teamNo <= teamsPerTier; teamNo++) {
          const teamSubGroups = tierSubGroups.filter(sg => sg.team === teamNo);
          if (teamSubGroups.length === 0) continue;
          const teamStudents = teamSubGroups.flatMap(sg => sg.students);
          allGroups.push({
            id: `R${roundNo}-梯${tier.tierNo}-隊${teamNo}`,
            slotId,
            roundNo,
            tierNo: tier.tierNo,
            teamNo,
            preferredPattern: tier.pattern,
            students: teamStudents,
            subGroups: teamSubGroups,
            region: getMainRegion(teamStudents)
          });
        }
      });
    });

    allGroups.sort((a, b) => {
      if (a.roundNo !== b.roundNo) return a.roundNo - b.roundNo;
      if (a.tierNo !== b.tierNo) return a.tierNo - b.tierNo;
      return a.teamNo - b.teamNo;
    });

    const newSchedule = [];
    const MAX_WAIT_AFTER_CHECKIN_MINUTES = 50;
    const INTERVIEW_WORK_BLOCK_MINUTES = 40;
    const INTERVIEW_BREAK_MINUTES = 10;
    const lunchStart = parseTime(settings.lunchStart);
    const lunchEnd = parseTime(settings.lunchEnd);
    
    const practiceRoomAvailable = Array(Number(settings.practiceRooms)).fill(parseTime(settings.startTime));
    const interviewRoomAvailable = Array(Number(settings.interviewRooms)).fill(parseTime(settings.startTime));
    const assistantAvailable = Array(Number(settings.assistantsCount)).fill(parseTime(settings.startTime));
    const practiceCapacityPerRoom = Math.max(1, Number(settings.groupSize || 1));

    const getAvailablePracticeRooms = (atTime, requiredRooms) => {
      const roomIndexes = practiceRoomAvailable
        .map((freeTime, idx) => (freeTime <= atTime ? idx : -1))
        .filter(idx => idx !== -1);
      if (roomIndexes.length < requiredRooms) return null;
      return roomIndexes.slice(0, requiredRooms);
    };

    const formatPracticeRoomLabel = (roomIndexes) => {
      if (!roomIndexes || roomIndexes.length === 0) return '實作教室';
      if (roomIndexes.length === 1) return `實作教室 ${roomIndexes[0] + 1}`;
      return `實作教室 ${roomIndexes.map(i => i + 1).join('、')}`;
    };

    const failedGroups = [];

    allGroups.forEach(group => {
      const slotConfig = registrationSlots.find(s => Number(s.id) === group.slotId);
      if (!slotConfig) return;
      const slotStartTime = parseTime(slotConfig.start);
      const slotEndTime = parseTime(slotConfig.end);
      const requiredPracticeRooms = Math.max(1, Math.ceil(group.students.length / practiceCapacityPerRoom));

      if (requiredPracticeRooms > Number(settings.practiceRooms)) {
        alert(`警告：梯次 ${group.id} 需要 ${requiredPracticeRooms} 間實作教室，但目前只設定 ${settings.practiceRooms} 間。\n請提高每間容量或增加實作教室數後再重排。`);
        return;
      }

      let t = Math.max(slotEndTime, parseTime(settings.startTime));
      const P_TIME = settings.practiceMinutes;
      const interviewWorkMinutes = group.subGroups.length * settings.interviewMinutes;
      const interviewBreakCount = Math.floor(Math.max(0, interviewWorkMinutes - 1) / INTERVIEW_WORK_BLOCK_MINUTES);
      const I_TIME = interviewWorkMinutes + (interviewBreakCount * INTERVIEW_BREAK_MINUTES);
      const TR_TIME = settings.transitMinutes;
      const TOTAL_TIME = P_TIME + TR_TIME + I_TIME; 
      const crossDeptBlocks = group.students
        .filter(s => s.isCrossDept && s.blockedStart && s.blockedEnd)
        .map(s => ({
          start: parseTime(s.blockedStart),
          end: parseTime(s.blockedEnd)
        }))
        .filter(block => Number.isFinite(block.start) && Number.isFinite(block.end) && block.end > block.start);

      const getWaitingEventType = (start, end) => {
        const overlapsCrossDeptBlock = crossDeptBlocks.some(block => Math.max(start, block.start) < Math.min(end, block.end));
        return overlapsCrossDeptBlock ? '跨系避開 / 候位' : '休息 / 準備移動';
      };

      const getCountedWaitMinutes = (activityStart) => {
        if (activityStart <= slotEndTime) return 0;
        const excludedBlocks = [
          ...crossDeptBlocks,
          { start: lunchStart, end: lunchEnd }
        ]
          .map(block => ({
            start: Math.max(slotEndTime, block.start),
            end: Math.min(activityStart, block.end)
          }))
          .filter(block => block.end > block.start)
          .sort((a, b) => a.start - b.start);

        const mergedBlocks = [];
        excludedBlocks.forEach(block => {
          const last = mergedBlocks[mergedBlocks.length - 1];
          if (last && block.start <= last.end) {
            last.end = Math.max(last.end, block.end);
          } else {
            mergedBlocks.push({ ...block });
          }
        });

        const excludedMinutes = mergedBlocks.reduce((sum, block) => sum + (block.end - block.start), 0);
        return Math.max(0, (activityStart - slotEndTime) - excludedMinutes);
      };

      const findBestSlot = (maxWaitMinutes = null) => {
        let cursor = t;
        let found = null;

        while (cursor <= parseTime(settings.endTime) + 480) { 
          if (maxWaitMinutes != null && getCountedWaitMinutes(cursor) > maxWaitMinutes) break;
          if (cursor < lunchStart && cursor + TOTAL_TIME > lunchStart) { cursor = lunchEnd; continue; }
          if (cursor >= lunchStart && cursor < lunchEnd) { cursor = lunchEnd; continue; }

          const hasCrossDeptConflict = crossDeptBlocks.some(block => (
            Math.max(cursor, block.start) < Math.min(cursor + TOTAL_TIME, block.end)
          ));

          if (hasCrossDeptConflict) { cursor += 5; continue; }

          let p1_rooms = getAvailablePracticeRooms(cursor, requiredPracticeRooms);
          let i1_room = interviewRoomAvailable.findIndex(freeTime => freeTime <= cursor + P_TIME + TR_TIME);
          let ast1 = assistantAvailable.findIndex(freeTime => freeTime <= cursor);
          const pFirstOk = !!p1_rooms && i1_room !== -1 && ast1 !== -1;

          let i2_room = interviewRoomAvailable.findIndex(freeTime => freeTime <= cursor);
          let p2_rooms = getAvailablePracticeRooms(cursor + I_TIME + TR_TIME, requiredPracticeRooms);
          let ast2 = assistantAvailable.findIndex(freeTime => freeTime <= cursor);
          const iFirstOk = i2_room !== -1 && !!p2_rooms && ast2 !== -1;

          const preferredFirst = group.preferredPattern === 'I-P' ? 'I-P' : 'P-I';
          const fallbackSecond = preferredFirst === 'I-P' ? 'P-I' : 'I-P';
          const choosePattern = (pattern) => {
            if (pattern === 'P-I' && pFirstOk) {
              return { start: cursor, pattern: 'P-I', pRooms: p1_rooms, iRoom: i1_room, ast: ast1 };
            }
            if (pattern === 'I-P' && iFirstOk) {
              return { start: cursor, pattern: 'I-P', pRooms: p2_rooms, iRoom: i2_room, ast: ast2 };
            }
            return null;
          };
          found = choosePattern(preferredFirst) || choosePattern(fallbackSecond);
          if (found) break;
          cursor += 5; 
        }

        return found;
      };

      let bestSlot = findBestSlot(MAX_WAIT_AFTER_CHECKIN_MINUTES);
      if (!bestSlot) {
        failedGroups.push(group.id);
        return;
      }

      newSchedule.push({
        groupId: group.id, region: group.region, type: '📝 報到與身分查驗',
        room: '系辦報到處 / 考生休息室', assistant: '行政報到組',
        startTime: formatTime(slotStartTime), endTime: formatTime(slotEndTime),
        startTimeMins: slotStartTime, students: group.students, isRegistration: true
      });

      const assistantName = normalizeAssistantNames(settings.assistantNames, settings.assistantsCount)[bestSlot.ast] || `工讀生 ${String.fromCharCode(65 + bestSlot.ast)}`; 
      let currentEventTime = bestSlot.start;

      if (currentEventTime > slotEndTime) {
        if (slotEndTime < lunchStart && currentEventTime > lunchStart) {
          if (lunchStart > slotEndTime) {
            newSchedule.push({
              groupId: group.id, region: group.region, type: getWaitingEventType(slotEndTime, lunchStart),
              room: '考生休息室', assistant: assistantName,
              startTime: formatTime(slotEndTime), endTime: formatTime(lunchStart),
              startTimeMins: slotEndTime, students: [], isTransit: true
            });
          }
          newSchedule.push({
            groupId: group.id, region: group.region, type: '午休',
            room: '考生休息室', assistant: assistantName,
            startTime: formatTime(lunchStart), endTime: formatTime(lunchEnd),
            startTimeMins: lunchStart, students: [], isTransit: true
          });
          if (currentEventTime > lunchEnd) {
            newSchedule.push({
              groupId: group.id, region: group.region, type: getWaitingEventType(lunchEnd, currentEventTime),
              room: '考生休息室', assistant: assistantName,
              startTime: formatTime(lunchEnd), endTime: formatTime(currentEventTime),
              startTimeMins: lunchEnd, students: [], isTransit: true
            });
          }
        } else {
          newSchedule.push({
            groupId: group.id, region: group.region, type: getWaitingEventType(slotEndTime, currentEventTime),
            room: '考生休息室', assistant: assistantName,
            startTime: formatTime(slotEndTime), endTime: formatTime(currentEventTime),
            startTimeMins: slotEndTime, students: [], isTransit: true
          });
        }
      }

      const appendInterviewFlow = (startTime) => {
        let interviewTime = startTime;
        let accumulatedInterviewMinutes = 0;

        group.subGroups.forEach((subGroup, idx) => {
          const batchTag = subGroup.label;
          newSchedule.push({
            groupId: group.id, region: group.region, type: `面試審查`, batchInfo: batchTag,
            room: `面試考場 ${bestSlot.iRoom + 1}`, assistant: assistantName,
            startTime: formatTime(interviewTime), endTime: formatTime(interviewTime + settings.interviewMinutes),
            startTimeMins: interviewTime, students: subGroup.students
          });
          interviewTime += settings.interviewMinutes;
          accumulatedInterviewMinutes += settings.interviewMinutes;

          if (
            idx < group.subGroups.length - 1 &&
            accumulatedInterviewMinutes >= INTERVIEW_WORK_BLOCK_MINUTES
          ) {
            newSchedule.push({
              groupId: group.id, region: group.region, type: `面試休息 (${INTERVIEW_BREAK_MINUTES} 分鐘)`,
              room: `面試考場 ${bestSlot.iRoom + 1}`, assistant: assistantName,
              startTime: formatTime(interviewTime), endTime: formatTime(interviewTime + INTERVIEW_BREAK_MINUTES),
              startTimeMins: interviewTime, students: [], isTransit: true
            });
            interviewTime += INTERVIEW_BREAK_MINUTES;
            accumulatedInterviewMinutes = 0;
          }
        });

        return interviewTime;
      };

      if (bestSlot.pattern === 'P-I') {
        newSchedule.push({
          groupId: group.id, region: group.region, type: '實作測驗',
          room: formatPracticeRoomLabel(bestSlot.pRooms), assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + P_TIME),
          startTimeMins: currentEventTime, students: group.students
        });
        currentEventTime += P_TIME;

        newSchedule.push({
          groupId: group.id, region: group.region, type: '換場移動',
          room: '依考場動線引導', assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + TR_TIME),
          startTimeMins: currentEventTime, students: group.students, isTransit: true
        });
        currentEventTime += TR_TIME;

        currentEventTime = appendInterviewFlow(currentEventTime);
        bestSlot.pRooms.forEach(roomIdx => { practiceRoomAvailable[roomIdx] = bestSlot.start + P_TIME; });
        interviewRoomAvailable[bestSlot.iRoom] = bestSlot.start + TOTAL_TIME;
        assistantAvailable[bestSlot.ast] = bestSlot.start + TOTAL_TIME;

      } else {
        currentEventTime = appendInterviewFlow(currentEventTime);

        newSchedule.push({
          groupId: group.id, region: group.region, type: '換場移動',
          room: '依考場動線引導', assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + TR_TIME),
          startTimeMins: currentEventTime, students: group.students, isTransit: true
        });
        currentEventTime += TR_TIME;

        newSchedule.push({
          groupId: group.id, region: group.region, type: '實作測驗',
          room: formatPracticeRoomLabel(bestSlot.pRooms), assistant: assistantName,
          startTime: formatTime(currentEventTime), endTime: formatTime(currentEventTime + P_TIME),
          startTimeMins: currentEventTime, students: group.students
        });
        interviewRoomAvailable[bestSlot.iRoom] = bestSlot.start + I_TIME;
        bestSlot.pRooms.forEach(roomIdx => { practiceRoomAvailable[roomIdx] = bestSlot.start + TOTAL_TIME; });
        assistantAvailable[bestSlot.ast] = bestSlot.start + TOTAL_TIME;
      }
    });

    if (failedGroups.length > 0) {
      alert(`以下隊伍扣除跨系避開時段後，仍無法在 ${MAX_WAIT_AFTER_CHECKIN_MINUTES} 分鐘內排入第一個活動：\n${failedGroups.join('、')}\n\n請增加場地/人力，或調整學生報到時段後再重排。`);
      return;
    }

    const combinedSchedule = [...newSchedule].sort((a, b) => a.startTimeMins - b.startTimeMins);
    const groupsMap = {};
    newSchedule.forEach(item => {
      if (!groupsMap[item.groupId]) { groupsMap[item.groupId] = { id: item.groupId, region: item.region, assistant: item.assistant, allStudents: [], events: [] }; }
      groupsMap[item.groupId].events.push(item);
      if (item.students && !item.isTransit && !item.isRegistration) {
        item.students.forEach(s => {
          if (!groupsMap[item.groupId].allStudents.find(ex => ex.id === s.id)) groupsMap[item.groupId].allStudents.push(s);
        });
      }
    });

    const groupedFlow = Object.values(groupsMap).map(g => {
       g.events.sort((a, b) => a.startTimeMins - b.startTimeMins);
       if (g.allStudents.length === 0) {
          const regEvent = g.events.find(e => e.isRegistration);
          if (regEvent && regEvent.students) g.allStudents = regEvent.students;
       }
       const leadEvent =
         g.events.find(e => !e.isRegistration && /^工讀生\s*[A-Z]/.test(String(e.assistant || ''))) ||
         g.events.find(e => /^工讀生\s*[A-Z]/.test(String(e.assistant || ''))) ||
         g.events.find(e => e.assistant);
       if (leadEvent) g.assistant = leadEvent.assistant;
       return g;
    });

    setSchedule({ combined: combinedSchedule, grouped: groupedFlow });
    setActiveTab('schedule');
    setViewMode('table');
  };

  const isValidCloudUrl = (url) => url.includes("script.google.com/macros/s/");

  const buildCloudPayload = () => {
    const exportData = schedule.combined.map(item => ({
      "時間": `${item.startTime}-${item.endTime}`,
      "梯次": item.groupId,
      "項目": `${item.type} ${item.batchInfo || ''}`,
      "場地": item.room,
      "人員": item.assistant,
      "名單": item.students ? item.students.map(s => `${s.checkinNo || ''}-${s.name}(${s.isCrossDept ? '跨' : ''})`).join(', ') : ''
    }));

    return {
      app: '4p-scheduler',
      version: 2,
      savedAt: new Date().toISOString(),
      localTime: new Date().toLocaleString('zh-TW', { hour12: false }),
      data: {
        department: currentDepartment ? { id: currentDepartment.id, name: currentDepartment.name } : null,
	        students, schedule, settings, registrationSlots, regions,
	        announcement: fieldAnnouncement,
	        taskConfirmations
      },
      scheduleRows: exportData
    };
  };

  // Google 雲端儲存 (透過 Google Apps Script Web App)
  const submitToGoogleCloud = async ({ silent = false, closeModal = true, trigger = 'manual' } = {}) => {
    if (!isValidCloudUrl(cloudUrl)) {
      if (!silent) alert("請輸入有效的 Google Apps Script 網址 (通常以 https://script.google.com/... 開頭)");
      return false;
    }

    if (trigger === 'auto') setIsAutoSyncing(true);
    else setIsSaving(true);

    try {
      const payload = buildCloudPayload();
      const response = await fetch(cloudUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'upsertSnapshot',
          payload
        })
      });

      const raw = await response.text();
      let json = null;
      try {
        json = JSON.parse(raw);
      } catch (_) {
        throw new Error('Web App 回傳非 JSON。請確認 Apps Script 有 doPost，且已重新部署。');
      }

      if (!response.ok || !json.ok) {
        throw new Error(json.error || `HTTP ${response.status}`);
      }

      const syncedAt = new Date().toLocaleString('zh-TW', { hour12: false });
      setLastCloudSyncAt(syncedAt);
      if (!silent) {
        alert("✅ 已同步完整資料到 Google 試算表！");
      }
      if (closeModal) setShowCloudModal(false);
      return true;
    } catch (error) {
      if (!silent) {
        alert(`❌ 備份失敗：${error.message}\n請確認 Apps Script 已部署為 Web App，且允許「任何人」存取。`);
      } else {
        console.warn('自動備份失敗：', error);
      }
      return false;
    } finally {
      if (trigger === 'auto') setIsAutoSyncing(false);
      else setIsSaving(false);
    }
  };

	  const loadFromGoogleCloud = async () => {
	    if (!isValidCloudUrl(cloudUrl)) {
	      alert("請先貼上有效的 Google Apps Script 網址。");
	      return;
    }

    setIsLoadingCloud(true);
    try {
      const url = `${cloudUrl}${cloudUrl.includes('?') ? '&' : '?'}action=getLatestSnapshot`;
      const res = await fetch(url, { method: 'GET' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const json = await res.json();
      if (!json || !json.ok || !json.data) {
        throw new Error('找不到可用的雲端資料');
      }

      const cloudData = json.data;
      if (cloudData.students) setStudents(ensureStudentCheckinNos(cloudData.students));
	      if (cloudData.schedule) setSchedule(ensureScheduleShape(cloudData.schedule));
	      if (cloudData.settings) setSettings(cloudData.settings);
	      if (cloudData.registrationSlots) setRegistrationSlots(cloudData.registrationSlots);
	      if (cloudData.regions) setRegions(cloudData.regions);
	      if (typeof cloudData.announcement === 'string') setFieldAnnouncement(cloudData.announcement);
	      if (cloudData.taskConfirmations && typeof cloudData.taskConfirmations === 'object') setTaskConfirmations(cloudData.taskConfirmations);

      const syncedAt = new Date().toLocaleString('zh-TW', { hour12: false });
      setLastCloudSyncAt(syncedAt);
      alert("✅ 已從 Google 雲端載入最新資料。");
    } catch (error) {
      alert(`❌ 載入失敗：${error.message}\n請確認您的 Apps Script 有實作 action=getLatestSnapshot。`);
    } finally {
	      setIsLoadingCloud(false);
	    }
	  };

	  const applyLiveCloudData = (cloudData) => {
	    if (!cloudData || typeof cloudData !== 'object') return;
	    if (typeof cloudData.announcement === 'string') setFieldAnnouncement(cloudData.announcement);
	    if (cloudData.taskConfirmations && typeof cloudData.taskConfirmations === 'object') {
	      setTaskConfirmations(cloudData.taskConfirmations);
	    }
	    if (Array.isArray(cloudData.students)) {
	      const statusById = {};
	      cloudData.students.forEach(student => {
	        if (student?.id) statusById[`id:${student.id}`] = student.checkinStatus;
	        if (student?.checkinNo) statusById[`no:${student.checkinNo}`] = student.checkinStatus;
	      });
	      setStudents(prev => prev.map(student => {
	        const nextStatus = statusById[`id:${student.id}`] || statusById[`no:${student.checkinNo}`];
	        return nextStatus && CHECKIN_STATUS_OPTIONS.includes(nextStatus)
	          ? { ...student, checkinStatus: nextStatus }
	          : student;
	      }));
	    }
	    setLastLiveSyncAt(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
	  };

	  const syncLiveFieldsFromGoogleCloud = async ({ silent = true } = {}) => {
	    if (!isValidCloudUrl(cloudUrl)) return false;
	    try {
	      const url = `${cloudUrl}${cloudUrl.includes('?') ? '&' : '?'}action=getLatestSnapshot`;
	      const res = await fetch(url, { method: 'GET' });
	      if (!res.ok) throw new Error(`HTTP ${res.status}`);
	      const json = await res.json();
	      if (!json || !json.ok || !json.data) throw new Error('找不到可用的雲端資料');
	      applyLiveCloudData(json.data);
	      return true;
	    } catch (error) {
	      if (!silent) alert(`❌ 即時同步失敗：${error.message}`);
	      else console.warn('即時同步失敗：', error);
	      return false;
	    }
	  };

	  useEffect(() => {
	    if (!isInitialized || !autoBackupEnabled || !selectedDepartmentId) return;
    if (!isValidCloudUrl(cloudUrl)) return;
    const minutes = Math.max(1, Number(autoBackupMinutes) || 5);
    const timer = setInterval(() => {
      submitToGoogleCloud({ silent: true, closeModal: false, trigger: 'auto' });
    }, minutes * 60 * 1000);

    return () => clearInterval(timer);
	  }, [isInitialized, autoBackupEnabled, autoBackupMinutes, cloudUrl, students, schedule, settings, registrationSlots, regions, fieldAnnouncement, taskConfirmations, selectedDepartmentId]);

	  useEffect(() => {
	    if (!isInitialized || !selectedDepartmentId || !isValidCloudUrl(cloudUrl)) return;
	    const timer = setInterval(() => {
	      syncLiveFieldsFromGoogleCloud({ silent: true });
	    }, 20000);
	    return () => clearInterval(timer);
	  }, [isInitialized, selectedDepartmentId, cloudUrl]);

	  const handlePrintPDF = () => { window.print(); };

  const getTaskDescription = (type, studentsList) => {
    if (type.includes('報到')) {
      return (
        <div className="space-y-1">
          <p>1. 協助考生與家長完成報到流程(確認姓名、系別、報到時間)</p>
          <p>2. 查詢並回覆有關補助獎金發放及接駁車候車情形</p>
          <p>3. 指引考生前往「休息區」等候並維持秩序</p>
        </div>
      );
    } else if (type.includes('換場') || type.includes('休息')) {
      return (
        <div className="space-y-1">
          <p>1. 協助維持安靜與秩序，引導學生集合準備</p>
          <p>2. 確保動線流暢，帶領考生至下一關卡</p>
          <p>3. 若考生焦慮，給予適當安撫與鼓勵</p>
        </div>
      );
    } else {
      return (
        <div className="space-y-2">
          <p className="font-bold text-gray-800">【本梯次點名名單】</p>
          <div className="flex flex-wrap gap-x-2 gap-y-1">
            {studentsList?.map(s => (<span key={`${s.id}-${s.checkinNo || ''}`} className="whitespace-nowrap">{formatStudentLabel(s)} {s.isCrossDept ? '(跨)' : ''}</span>))}
          </div>
          <p className="pt-2 mt-2 border-t border-gray-300 text-gray-600">※ 確保考試順利進行，並清點人數無誤。</p>
        </div>
      );
    }
  };

  const buildPrintRows = (items) => {
    const timeMap = new Map();
    items.forEach((item) => {
      const key = `${item.startTime}-${item.endTime}`;
      if (!timeMap.has(key)) {
        timeMap.set(key, {
          startTime: item.startTime,
          endTime: item.endTime,
          startTimeMins: item.startTimeMins,
          entries: []
        });
      }
      timeMap.get(key).entries.push(item);
    });

    const mergeEntries = (entries) => {
      const mergedMap = new Map();
      entries.forEach((entry) => {
        const key = `${entry.assistant}__${entry.type}__${entry.room}`;
        if (!mergedMap.has(key)) {
          mergedMap.set(key, {
            assistant: entry.assistant,
            type: entry.type,
            room: entry.room,
            groupIds: [],
            students: [],
            studentIds: new Set(),
            batchInfos: []
          });
        }
        const merged = mergedMap.get(key);
        if (entry.groupId && !merged.groupIds.includes(entry.groupId)) {
          merged.groupIds.push(entry.groupId);
        }
        if (entry.batchInfo && !merged.batchInfos.includes(entry.batchInfo)) {
          merged.batchInfos.push(entry.batchInfo);
        }
        (entry.students || []).forEach((student) => {
          if (!merged.studentIds.has(student.id)) {
            merged.studentIds.add(student.id);
            merged.students.push(student);
          }
        });
      });

      return Array.from(mergedMap.values()).map(({ studentIds, ...rest }) => rest);
    };

    return Array.from(timeMap.values())
      .sort((a, b) => a.startTimeMins - b.startTimeMins)
      .map((row) => ({ ...row, mergedEntries: mergeEntries(row.entries) }));
  };

	  const printRows = buildPrintRows(Array.isArray(schedule?.combined) ? schedule.combined : []);
	  const isAssistantPublicRoute = new URLSearchParams(window.location.search).get('assistantCard') === '1';
	  const assistantPublicPayload = isAssistantPublicRoute ? getAssistantSharePayloadFromUrl() : null;

	  if (isAssistantPublicRoute) {
	    return renderAssistantPublicPage(assistantPublicPayload || {
	      assistantName: '連結資料無法讀取',
	      departmentName: '工讀生流程表',
	      generatedAt: '',
	      assistantNames: [],
	      groups: []
	    });
	  }

	  return (
    <>
      <style>{`
        @media print {
          @page { size: A4 landscape; margin: 12mm; }
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: white !important; }
        }
      `}</style>

      {/* 雲端存檔 Modal */}
      {showCloudModal && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 print:hidden">
          <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-lg w-full relative">
            <button onClick={() => setShowCloudModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-700"><X size={24} /></button>
            <div className="flex items-center text-indigo-600 mb-4">
              <CloudUpload size={32} className="mr-3" />
              <h2 className="text-2xl font-bold">Google 雲端同步</h2>
            </div>
            <p className="text-gray-600 text-sm mb-6 leading-relaxed">
              建議使用 <strong>Google 試算表 + Apps Script</strong> 當雲端資料庫。Google 表單偏向收件，不適合雙向編輯。貼上 Web App 網址後，即可手動同步、雲端載入與定時備份。
            </p>
            <div className="mb-6">
              <label className="block text-sm font-bold text-gray-700 mb-2">Google API 網址：</label>
              <input 
                type="text" 
                placeholder="https://script.google.com/macros/s/..."
                value={cloudUrl}
                onChange={(e) => setCloudUrl(e.target.value)}
                disabled={!isAdminMode}
                className={`w-full border-2 rounded-xl p-3 outline-none transition-all font-mono text-sm ${isAdminMode ? 'border-indigo-100 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200' : 'bg-slate-100 border-slate-200 text-slate-500 cursor-not-allowed'}`}
              />
              {!isAdminMode && (
                <p className="mt-2 text-xs font-medium text-slate-500">管理員模式才可修改 Google API 網址。</p>
              )}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              <button 
                onClick={loadFromGoogleCloud}
                disabled={isLoadingCloud || isSaving}
                className={`py-3 rounded-xl font-bold text-indigo-700 border transition-all flex justify-center items-center ${isLoadingCloud || isSaving ? 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed' : 'bg-white border-indigo-200 hover:bg-indigo-50'}`}
              >
                {isLoadingCloud ? <RefreshCw className="animate-spin mr-2" size={18} /> : <Download className="mr-2" size={18} />}
                {isLoadingCloud ? '雲端讀取中...' : '從 Google 載入'}
              </button>
              <button 
                onClick={() => submitToGoogleCloud({ silent: false, closeModal: true, trigger: 'manual' })}
                disabled={isSaving || isLoadingCloud}
                className={`py-3 rounded-xl font-bold text-white shadow-lg transition-all flex justify-center items-center ${isSaving || isLoadingCloud ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 hover:-translate-y-0.5'}`}
              >
                {isSaving ? <RefreshCw className="animate-spin mr-2" size={20} /> : <CloudUpload className="mr-2" size={20} />}
                {isSaving ? '上傳同步中...' : '推送到 Google'}
              </button>
            </div>

            <div className="bg-slate-50 border border-slate-200 rounded-xl p-4">
              <div className="flex items-center justify-between gap-2 mb-3">
                <label className="flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer">
                  <input
                    type="checkbox"
                    className="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                    checked={autoBackupEnabled}
                    onChange={(e) => setAutoBackupEnabled(e.target.checked)}
                  />
                  啟用定時自動備份
                </label>
                <select
                  value={autoBackupMinutes}
                  onChange={(e) => setAutoBackupMinutes(Number(e.target.value))}
                  className="border border-slate-300 rounded-lg px-2 py-1 text-sm bg-white"
                  disabled={!autoBackupEnabled}
                >
                  <option value={1}>每 1 分鐘</option>
                  <option value={3}>每 3 分鐘</option>
                  <option value={5}>每 5 分鐘</option>
                  <option value={10}>每 10 分鐘</option>
                  <option value={15}>每 15 分鐘</option>
                </select>
              </div>
              <p className="text-xs text-slate-500">
                狀態：{isAutoSyncing ? '自動備份中...' : '待機'}；最近同步：{lastCloudSyncAt || '尚未同步'}
              </p>
            </div>
          </div>
        </div>
      )}

      {showAdminModal && (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 print:hidden">
          <form onSubmit={handleAdminSubmit} className="bg-white rounded-2xl shadow-2xl p-7 max-w-md w-full relative border border-slate-200">
            <button type="button" onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-700"><X size={22} /></button>
            <div className="flex items-center text-slate-800 mb-5">
              <div className="bg-indigo-50 text-indigo-700 border border-indigo-100 p-2 rounded-xl mr-3">
                <KeyRound size={24} />
              </div>

                              <td className={`p-4 font-bold ${item.isRegistration ? 'text-teal-700' : ''}`}>
                                {item.type} {item.batchInfo ? <span className="text-blue-600 text-xs ml-1 bg-blue-50 px-1 rounded border border-blue-100">{item.batchInfo}</span> : ''}
                              </td>
                              <td className="p-4 font-medium">
                                {item.room}
                              </td>
                              <td className="p-4">
                                <span className={`inline-flex items-center whitespace-nowrap px-2.5 py-1 rounded-md text-xs font-bold border ${assistantColor.accentSoftBg} ${assistantColor.accentText} ${assistantColor.accentBorder}`}>{item.assistant}</span>
                              </td>
                              <td className="p-4 align-top">
                                <div className="grid w-full grid-cols-1 md:grid-cols-2 gap-1.5">
	                                  {item.students?.map((s, i) => {
	                                    const currentStudent = getCurrentStudent(s);
	                                    return (
	                                    <span key={i} className={`text-xs px-2 py-0.5 rounded flex items-center w-full min-w-0 whitespace-nowrap overflow-hidden text-ellipsis ${item.isTransit ? '' : (s.isCrossDept ? 'bg-orange-100 text-orange-800 border border-orange-200 font-bold' : (item.isRegistration ? 'bg-teal-100 text-teal-800 border-teal-200' : 'bg-white border border-slate-200 shadow-sm'))}`}>
	                                      {s.isCrossDept && <AlertTriangle size={12} className="mr-1 text-orange-600" />}
	                                      <span className="truncate">{formatStudentLabel(currentStudent)}</span>
	                                      <span className="ml-1 shrink-0">{renderCheckinStatusBadge(getCheckinStatus(currentStudent))}</span>
	                                    </span>
	                                    );
	                                  })}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

	          </div>
	        </div>
	      </div>
	      )}

	      {schedule.combined.length > 0 && (
        <div className="hidden print:block w-full bg-white text-black p-2 font-serif">
          <div className="text-center mb-6 relative">
	             <h1 className="text-2xl font-bold mb-2 tracking-widest">{currentDepartment?.name || ''} 114學年度 四技甄選 作業流程分配、細項</h1>
             <p className="text-lg font-bold">※請老師及幫手們於 8:00 到校準備！</p>
          </div>

          <table className="w-full border-collapse border-[2px] border-black text-sm">
            <thead>
              <tr className="bg-gray-100 border-b-[2px] border-black">
                <th className="border border-black p-3 text-center w-[12%]">時間</th>
                <th className="border border-black p-3 text-center w-[15%]">負責人員</th>
                <th className="border border-black p-3 text-center w-[20%]">項目與場地</th>
                <th className="border border-black p-3 text-left w-[53%]">工作內容與學生名單</th>
              </tr>
            </thead>
            <tbody>
              {printRows.map((row, idx) => (
                <tr key={idx} className="border-b border-black">
                  <td className="border border-black p-3 text-center font-bold text-base align-top whitespace-nowrap">
                    {row.startTime} - {row.endTime}
                  </td>
                  <td className="border border-black p-3 align-top font-bold text-gray-800">
                    <div className="space-y-2">
                      {row.mergedEntries.map((entry, eidx) => (
                        <div key={eidx} className="border-b border-dashed border-gray-300 pb-2 last:border-b-0 last:pb-0 text-center">
                          {entry.assistant}
                        </div>
                      ))}
                    </div>
                  </td>
                  <td className="border border-black p-3 align-top">
                    <div className="space-y-3">
                      {row.mergedEntries.map((entry, eidx) => (
                        <div key={eidx} className="border-b border-dashed border-gray-300 pb-3 last:border-b-0 last:pb-0 text-center">
                          <div className="font-bold text-base mb-1">{entry.type}{entry.batchInfos.length > 0 ? ` ${entry.batchInfos.join('、')}` : ''}</div>
                          <div className="text-gray-700 bg-gray-100 border border-gray-300 inline-block px-2 py-1 rounded">
                            {entry.groupIds.join('、')}
                          </div>
                          <div className="mt-2 text-gray-800 font-semibold">{entry.room}</div>
                        </div>
                      ))}
                    </div>
                  </td>
                  <td className="border border-black p-3 align-top">
                    <div className="space-y-3">
                      {row.mergedEntries.map((entry, eidx) => (
                        <div key={eidx} className="border-b border-dashed border-gray-300 pb-3 last:border-b-0 last:pb-0">
                          <p className="font-bold text-gray-700 mb-1">適用梯次：{entry.groupIds.join('、')}</p>
                          {getTaskDescription(entry.type, entry.students)}
                        </div>
                      ))}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-4 text-right text-xs text-gray-500">
             表單產生時間：{new Date().toLocaleString('zh-TW', { hour12: false })}
          </div>
        </div>
      )}
    </>
  );
};

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, message: '', stack: '' };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, message: String(error?.message || error || '未知錯誤') };
  }

  componentDidCatch(error, info) {
    this.setState({
      stack: String(info?.componentStack || '')
    });
    console.error('UI Render Error:', error, info);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-slate-100 p-6">
          <div className="max-w-4xl mx-auto bg-white border border-rose-200 rounded-2xl shadow p-6">
            <h1 className="text-2xl font-bold text-rose-700 mb-3">畫面載入失敗</h1>
            <p className="text-slate-700 mb-2">已攔截到前端錯誤，請把下面訊息貼給我，我會立即修正。</p>
            <pre className="text-xs bg-rose-50 border border-rose-200 rounded-lg p-3 overflow-auto whitespace-pre-wrap">{this.state.message}</pre>
            {this.state.stack && (
              <pre className="mt-3 text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-auto whitespace-pre-wrap">{this.state.stack}</pre>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}


      const root = createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
